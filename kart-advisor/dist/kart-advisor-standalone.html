<style>
/* Trackside first: big type, strong contrast for sunlight, 48px+ tap targets, one column. */
:root {
  --bg: #ffffff; --fg: #0a0a0a; --muted: #3d3d3d; --card: #f3f4f6; --line: #c7cbd1;
  --accent: #0b3d91; --accent-fg: #ffffff; --good: #0b6b2e; --warn: #8a4b00; --bad: #b00020;
  --chip: #e3e8f4; --focus: #ff9800;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1117; --fg: #f5f5f5; --muted: #c4c9d0; --card: #171c24; --line: #3a4350;
    --accent: #7fb0ff; --accent-fg: #0d1117; --good: #5fd38a; --warn: #ffb74d; --bad: #ff6b81;
    --chip: #233047; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1117; --fg: #f5f5f5; --muted: #c4c9d0; --card: #171c24; --line: #3a4350;
  --accent: #7fb0ff; --accent-fg: #0d1117; --good: #5fd38a; --warn: #ffb74d; --bad: #ff6b81;
  --chip: #233047; color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font: 18px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  padding-bottom: calc(76px + env(safe-area-inset-bottom));
}
main { max-width: 680px; margin: 0 auto; padding-block: 0; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1 { font-size: 1.25rem; margin: 0; }
h2 { font-size: 1.15rem; margin: 1.25rem 0 .5rem; }
h3 { font-size: 1rem; margin: 0 0 .25rem; }
a { color: var(--accent); }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; display: flex; align-items: center; justify-content: space-between;
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--accent); color: var(--accent-fg);
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--accent); }
.icon-btn { min-width: 48px; min-height: 48px; font-size: 1.4rem; background: transparent; color: inherit; border: 0; border-radius: 12px; }

nav.bottom {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 5; display: grid; grid-template-columns: repeat(4, 1fr);
  background: var(--bg); border-top: 2px solid var(--line); padding-bottom: env(safe-area-inset-bottom);
}
nav.bottom button { min-height: 60px; font: 700 1rem system-ui, sans-serif; background: none; color: var(--muted); border: 0; }
nav.bottom button[aria-current="page"] { color: var(--accent); box-shadow: inset 0 4px 0 var(--accent); }

.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin: 12px 0; }
label { display: block; font-weight: 600; margin: 10px 0 4px; }
.hint { color: var(--muted); font-size: .9rem; font-weight: 400; }
input, select, textarea {
  width: 100%; min-height: 48px; font: inherit; color: var(--fg); background: var(--bg);
  border: 2px solid var(--line); border-radius: 10px; padding: 8px 12px;
}
textarea { min-height: 88px; }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.row > div { min-width: 0; }

.seg { display: flex; flex-wrap: wrap; gap: 8px; }
.seg button, .chip {
  flex: 1 1 auto; min-height: 48px; padding: 8px 14px; font: 600 1rem system-ui, sans-serif;
  border: 2px solid var(--line); border-radius: 999px; background: var(--bg); color: var(--fg);
}
.seg button[aria-pressed="true"], .chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { flex: 0 1 auto; }

.btn { display: block; width: 100%; min-height: 56px; margin: 14px 0; font: 700 1.1rem system-ui, sans-serif; border-radius: 12px; border: 0; background: var(--accent); color: var(--accent-fg); }
.btn.secondary { background: transparent; color: var(--accent); border: 2px solid var(--accent); }
.btn.small { display: inline-block; width: auto; min-height: 48px; padding: 0 16px; margin: 6px 6px 6px 0; font-size: 1rem; }

.banner { border-radius: 12px; padding: 12px 14px; margin: 12px 0; font-weight: 600; border: 2px solid; }
.banner.ok { border-color: var(--good); color: var(--good); }
.banner.bad { border-color: var(--bad); color: var(--bad); }
.banner.warn { border-color: var(--warn); color: var(--warn); }
.banner ul { margin: .4rem 0 0; padding-left: 1.2rem; font-weight: 500; }

.field { background: var(--card); border: 1px solid var(--line); border-left: 6px solid var(--line); border-radius: 12px; padding: 12px 14px; margin: 10px 0; }
.field.set { border-left-color: var(--accent); }
.field.fixed_by_rule { border-left-color: var(--good); }
.field.blocked { border-left-color: var(--bad); }
.field.withheld, .field.relative { border-left-color: var(--warn); }
.field .head { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; flex-wrap: wrap; }
.field .label { font-weight: 700; }
.field .value { font-size: 1.6rem; font-weight: 800; line-height: 1.15; overflow-wrap: anywhere; }
.field .was { color: var(--muted); font-size: .95rem; }
.badge { display: inline-block; font-size: .8rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--chip); color: var(--fg); margin-right: 6px; }
.badge.up, .badge.down { background: var(--accent); color: var(--accent-fg); }
.badge.urgent, .badge.blocked { background: var(--bad); color: #fff; }
.reason { margin: 6px 0 0; }
details { margin-top: 6px; }
summary { min-height: 44px; display: flex; align-items: center; cursor: pointer; color: var(--accent); font-weight: 600; }
.steps { margin: 4px 0 0; padding-left: 1.1rem; font-size: .95rem; }
.steps li { margin: 4px 0; }
.src { font-size: .88rem; color: var(--muted); overflow-wrap: anywhere; }
.conf { font-size: .75rem; font-weight: 700; text-transform: uppercase; letter-spacing: .02em; padding: 1px 6px; border-radius: 6px; border: 1px solid var(--line); }

.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: .95rem; }
.kv b { white-space: nowrap; }
.list { padding-left: 1.2rem; }
.list li { margin: 6px 0; }
.session { border-top: 1px solid var(--line); padding: 10px 0; }
.toast { position: fixed; left: 16px; right: 16px; bottom: 90px; z-index: 9; background: var(--fg); color: var(--bg); padding: 14px; border-radius: 12px; font-weight: 700; text-align: center; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

@media (min-width: 560px) { .row.three { grid-template-columns: 1fr 1fr 1fr; } }

</style>

rces":["zipnorth_c50_carb","chebco_needle"],"confidence":"expert_consensus"}},"filter":{"wka_rule":{"value":"Aftermarket fabric and wire-mesh filter may replace the factory filter; flange and filter dimensions are specified; must not be modified","dimensions":null,"sources":["wka_tm_2022_002"],"confidence":"track_official"},"other_rules":[{"rule_set":"kra_newcastle","value":"non-tech","sources":["kra_newcastle_rules"],"confidence":"anecdote"},{"rule_set":"uas","value":"non-tech; no external scoop or ram effect","sources":["uas_kidkart"],"confidence":"anecdote"}],"common_choice":{"value":"K&N RC-1250 (2.25 in flange, conical)","sources":["ntk_forum_8846","racing90_rc1250"],"confidence":"anecdote"}},"jetting":{"method":"reference_plus_rule","reference":{"jet":null,"density_altitude_ft":null,"notes":"No published reference point. The user records jet + DA + plug read from a good session. Until then, output only changes relative to the current jet."},"rule":"Hold AFR constant: A_jet ∝ sqrt(rho_air), so d_jet ∝ rho^0.25. Target area = A_ref * sqrt(rho/rho_ref). Map area to a jet number using measured diameters (about 2% area per number); snap to the nearest available size; round toward the larger (richer) jet; clamp to the legal max of the active rule layers.","derivation":"m_f = Cd*A_j*sqrt(2*rho_f*dp); dp ≈ m_a^2/(2*rho_a*A_v^2), so sqrt(dp) ∝ m_a/sqrt(rho_a); AFR = m_a/m_f ∝ sqrt(rho_a)/A_j; constant AFR gives A_j ∝ sqrt(rho_a). Standard atmosphere: about -2.9% density per 1000 ft. Gives about 0.4-0.7 jet numbers per 1000 ft DA and about 0.3-0.5 numbers per 10 °F.","alternative_rule":{"value":"Longacre: change jet area by the same % as air density (A ∝ rho), about twice the sqrt rule (about 0.9-1.4 numbers per 1000 ft).","sources":["longacre","kartpulse_density"],"confidence":"anecdote","notes":"Recorded as a conflict, not averaged. sqrt rule is the default because it changes the jet less (safer when air thins)."},"table":[{"density_altitude_ft":-1000,"rel_density":1.03,"jet_if_58_at_0ft":58.4},{"density_altitude_ft":0,"rel_density":1,"jet_if_58_at_0ft":58},{"density_altitude_ft":1000,"rel_density":0.971,"jet_if_58_at_0ft":57.6},{"density_altitude_ft":2000,"rel_density":0.943,"jet_if_58_at_0ft":57.2},{"density_altitude_ft":3000,"rel_density":0.915,"jet_if_58_at_0ft":56.7}],"table_notes":"Illustration only (sqrt rule, nominal diameters, hypothetical reference of 58 at 0 ft). Not a published table.","direction":{"value":"lower density (heat, altitude, low pressure, humidity) richens the mixture, so use a smaller jet; cold dense air leans it, so use a larger jet","sources":["ducati_dellorto","longacre"],"confidence":"expert_consensus"},"sources":["engtips","ducati_dellorto","longacre","kartpulse_density","kartpulse_comer_jetting"],"confidence":"inferred"},"symptoms":[{"tag":"rich_bog","signs":"Sluggish, lugging off corners, sputter, smoke, wet black plug, oil spitting from the exhaust","fix":"First rule out choke, dirty filter and fouled plug; then one jet size smaller","sources":["kartpulse_leanrich","motocrosshideout","kartpulse_plug"],"confidence":"expert_consensus"},{"tag":"rich_top_end","signs":"Four-stroking (uneven blubbering) at full throttle or top speed; flat top end","fix":"One jet size smaller, checked with a plug chop","sources":["wiki_4stroking","motocrosshideout"],"confidence":"expert_consensus"},{"tag":"lean_ping","signs":"Over-revs or 'screams' then goes flat, sharp popping or pinging, overheating, white or grey chalky plug; seizure risk","fix":"Go one jet size LARGER right away; check intake air leaks, float and needle valve, fuel line and filter. Never lean out to chase speed.","sources":["motocrosshideout","wiki_4stroking","kartpulse_leanrich"],"confidence":"expert_consensus"},{"tag":"lean_bog","signs":"Hesitates or nearly dies when the throttle is snapped open, then surges","fix":"Richer jet; check fuel delivery","sources":["motocrosshideout"],"confidence":"anecdote"},{"tag":"no_idle","signs":"Needs choke to idle; dies when the throttle closes","fix":"Clean the idle hole and spray tube; check the float and needle valve and for intake leaks. Not a jet change.","sources":["ntk_7786","myrons_service"],"confidence":"anecdote"},{"tag":"plug_read","signs":"Light to dark tan or chocolate is good; white or grey is lean (or plug too hot); black and wet is rich. Read after a full-throttle plug chop; castor two-stroke plugs are hard to read; EGT is preferred.","fix":"Use as a sanity check for main jet changes","sources":["kartpulse_plug","kartpulse_leanrich"],"confidence":"expert_consensus"}],"fileKey":"carb"},"chassis":{"schema_version":1,"updated":"2026-10-18T00:00:00.000Z","model":"TopKart Kid Kart (TopKart USA '2026 Kid Kart Chassis'; EU name 'KID KART 50cc RT20'). Owner's model year TBD.","sources":{"topkart_usa_2026_page":{"url":"https://shop.topkartusa.net/products/kid-kart-chassis","title":"Top Kart USA – 2026 Kid Kart Chassis","confidence":"manufacturer","accessed":"2026-10-18T00:00:00.000Z","notes":"Seen via search summary only. Lists 25mm tube, 770mm WB, 30mm axle, IMAF Puffo seat, mechanical brake, 112DSM/140 wheels, C52 standard, no tires."},"topkart_usa_kidkart_old":{"url":"https://topkartusa.net/chassis/kid-kart/","title":"Top Kart USA – Kid Kart Chassis (older page, ~2015-16)","confidence":"manufacturer","accessed":"2026-10-18T00:00:00.000Z","notes":"Summary only. 25mm axle and bearings, D.17 spindle 10.5 deg, D.25 aluminium rear hubs, Puffo seat, mechanical brake."},"topkart_usa_axle25":{"url":"https://shop.topkartusa.net/products/25mm-kid-kart-axle","title":"Top Kart USA – 25mm Kid Kart Axle","confidence":"manufacturer","accessed":"2026-10-18T00:00:00.000Z","notes":"SKU 1000-138-04, 25x950x3, 'Top Kart original Kid Kart'. Sold out."},"topkart_usa_axles":{"url":"https://shop.topkartusa.net/collections/axles-hubs","title":"Top Kart USA – Axles & Components","confidence":"manufacturer","accessed":"2026-10-18T00:00:00.000Z","notes":"6x5x60 Mini/Kid Kart axle key fits h const DEFAULT_INPUTS = {
  track: 'ovrp', ruleSet: 'club', datetime: '', surface: 'dry', rubber: 'medium',
  tires: { brand: '', age: 'scuffed' }, weather: { pressureKind: 'station' },
  driver: { weightLb: null, experience: 'novice' }, feel: { text: '', chips: [] },
};
let kb, lastResult = null, lastInputs = null;
const HOSTED = () => !!document.getElementById('kb-data');
let inputs = { ...DEFAULT_INPUTS, ...store.get('ka.inputs', {}) };
let profile = store.get('ka.profile', { engine: 'Comer C52', driverSprocket: 10 });
const saveInputs = () => store.set('ka.inputs', inputs);

const STATUS = { kept: 'no change', set: 'change', relative: 'change (no baseline)', fixed_by_rule: 'fixed by rules', not_adjustable: 'not adjustable', withheld: 'need info', blocked: 'BLOCKED' };
const fmt = (v, u) => (v == null ? '—' : typeof v === 'number' ? `${+v.toFixed(2)}${u && u !== '#' ? ` ${u}` : ''}` : String(v));
const conf = c => String(c || 'unknown').replace(/_/g, ' ');
const nowLocal = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 16); };

// ---------------- boot ----------------
async function init() {
  applyTheme(store.get('ka.theme', null));
  $('#theme').addEventListener('click', () => { const t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'; store.set('ka.theme', t); applyTheme(t); });
  document.querySelectorAll('nav.bottom button').forEach(b => b.addEventListener('click', () => showTab(b.dataset.tab)));
  // Single-file build (tools/bundle.js) embeds the knowledge base and runs where service workers aren't allowed.
  const embedded = document.getElementById('kb-data');
  if (!embedded && 'serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  try { kb = embedded ? JSON.parse(embedded.textContent) : await (await fetch('data.json')).json(); }
  catch { $('#tab-setup').append(h('p', { class: 'banner bad' }, 'Could not load the knowledge base (data.json). Run "npm start" from kart-advisor/.')); return; }
  if (!kb.tracks[inputs.track]) inputs.track = Object.keys(kb.tracks)[0];
  renderSetup(); renderKart(); renderLog(); renderInfo();
  if (!db.storageIsPersistent()) toast('Storage is blocked: the log will not be kept after closing.');
}
function applyTheme(t) { if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme; }
function showTab(name) {
  document.querySelectorAll('.tab').forEach(s => (s.hidden = s.id !== `tab-${name}`));
  document.querySelectorAll('nav.bottom button').forEach(b => (b.dataset.tab === name ? b.setAttribute('aria-current', 'page') : b.removeAttribute('aria-current')));
  if (name === 'log') renderLog();
  window.scrollTo(0, 0);
}

function renderSetup() {

async function engineInputs() {
  const sessions = await db.listSessions(inputs.track);
  const learned = learn(sessions, inputs.track);
  const jetReference = profile.jetRefJet != null && profile.jetRefDaFt != null ? { jet: profile.jetRefJet, densityAltitudeFt: profile.jetRefDaFt } : learned.jetReference;
  return { ...structuredClone(inputs), kart: { ...profile, jetReference }, _learned: learned };
}

async function run(out) {
  const ei = await engineInputs();
  const learned = ei._learned; delete ei._learned;
  let r;
  try { r = recommend(kb, ei); }
  catch (e) { out.replaceChildren(h('p', { class: 'banner bad' }, `Could not compute a setup: ${e.message}`)); return; }
  lastResult = r; lastInputs = ei;
  out.replaceChildren(...renderSheet(r, learned));
}

function renderSheet(r, learned) {
  const els = [h('h2', {}, `Setup sheet: ${r.track.name}`)];
  const L = r.legality;
  if (L.blocked.length || L.currentIssues.length || L.conflicts.length) {
    els.push(h('div', { class: 'banner bad', role: 'alert' }, 'Legality: check these before going out',
      h('ul', {}, [...L.blocked.map(b => `Blocked output: ${r.fields[b].label}. No legal value under ${r.ruleSet.name}.`), ...L.currentIssues.map(i => i.text), ...L.conflicts.map(c => `Rule layers disagree: ${c}`)].map(t => h('li', {}, t)))));
  } else els.push(h('div', { class: 'banner ok' }, `Legal under: ${r.ruleSet.name}`));

  const d = r.derived;
  els.push(h('div', { class: 'card kv' },
    h('b', {}, 'Density altitude'), d.air ? `${d.air.densityAltitudeFt.toLocaleString()} ft (${(d.air.relativeDensity * 100).toFixed(1)}% air density)` : 'enter weather',
    h('b', {}, 'Grip estimate'), `${d.grip} (${d.gripBand})`,
    h('b', {}, 'Track layout'), r.track.geometry === 'available' ? `${d.demands.cornerCount} corners, ${d.demands.character.replace('_', ' ')}` : 'no corner data yet',
    L.totalWeightLb != null ? [h('b', {}, 'Weight with ballast'), `${L.totalWeightLb} lb`] : null));

  if (r.notes.length) els.push(h('div', { class: 'banner warn' }, 'Notes', h('ul', {}, r.notes.map(n => h('li', {}, n)))));
  for (const id of r.order) els.push(fieldCard(r.fields[id]));

  els.push(h('h2', {}, 'What to change next'));
  els.push(r.next.length ? h('ol', { class: 'list' }, r.next.map(n => h('li', {}, n.text)))
    : h('p', {}, r.feel.tags.length ? 'Nothing further: run the changes above and report back.' : 'Run a session, then tell the app how the kart felt.'));
  if (r.feel.notUnderstood.length) els.push(h('p', { class: 'hint' }, `Not understood: “${r.feel.notUnderstood.join('”, “')}”. Try the buttons above.`));
  if (r.feel.conflicts.length) els.push(h('div', { class: 'banner warn' }, r.feel.conflicts.join(' ')));

  if (learned?.changes.length) {
    els.push(h('h2', {}, `What helped before at ${r.track.name}`));
    els.push(h('ul', { class: 'list' }, learned.changes.slice(0, 6).map(c => h('li', {}, c.text, ' ', h('span', { class: 'conf' }, c.strength)))));
  }
  if (r.verify.length) els.push(h('details', { class: 'card' }, h('summary', {}, `Check trackside (${r.verify.length})`), h('ul', { class: 'list' }, r.verify.map(v => h('li', {}, v)))));
  els.push(h('button', { class: 'btn', type: 'button', onclick: saveToLog }, 'Save to session log'));
  return els;
}

function fieldCard(f) {
  let main;
  if (f.status === 'blocked') main = 'BLOCKED';
  else if (f.status === 'withheld') main = 'Need info';
  else if (f.status === 'relative' && typeof f.delta === 'number') main = `${f.delta > 0 ? '+' : '−'}${Math.abs(f.delta)} ${f.units}`;
  else main = f.display ?? fmt(f.value, f.units);
  const changedFrom = f.baseline != null && f.value != null && f.value !== f.baseline && f.status !== 'not_adjustable';
  const was = changedFrom ? `was ${fmt(f.baseline, f.units)}` : f.status === 'relative' ? 'from what you run now (no baseline in Kart profile)' : '';
  const urgent = f.steps.some(s => s.urgent);
  const srcs = resolveSources(kb, f.steps.flatMap(s => s.sources));
  return h('article', { class: `field ${f.status}` },
    h('div', { class: 'head' }, h('span', { class: 'label' }, f.label),
      h('span', {}, urgent ? h('span', { class: 'badge urgent' }, 'urgent') : null, h('span', { class: `badge ${f.status === 'blocked' ? 'blocked' : changedFrom || f.status === 'relative' ? 'up' : ''}` }, STATUS[f.status] || f.status), h('span', { class: 'conf' }, conf(f.confidence)))),
    h('div', { class: 'value' }, main), was ? h('div', { class: 'was' }, was) : null,
    h('p', { class: 'reason' }, f.reason),
    f.notes.length ? h('p', { class: 'hint' }, f.notes.join(' ')) : null,
    h('details', {}, h('summary', {}, 'Steps and sources'),
      h('ol', { class: 'steps' }, f.steps.map(s => h('li', {}, h('b', {}, `${s.stage}: `), s.text, ' ', h('span', { class: 'conf' }, conf(s.confidence))))),
      h('ul', { class: 'steps src' }, srcs.map(s => h('li', {}, s.url && /^https?:/.test(s.url) ? h('a', { href: s.url, target: '_blank', rel: 'noopener' }, s.title || s.url) : (s.title || s.id), ' ', h('span', { class: 'conf' }, conf(s.confidence)))))));
}

async function saveToLog() {
  if (!lastResult) return;
  const r = lastResult, ran = {};
  for (const f of LOGGED_FIELDS) { const v = r.fields[f]?.value; ran[f] = v ?? r.fields[f]?.baseline ?? null; }
  await db.saveSession({
    date: inputs.datetime || nowLocal(), track: inputs.track, configuration: r.track.configuration, ruleSet: inputs.ruleSet,
    surface: inputs.surface, rubber: inputs.rubber, trackTempF: r.derived.trackTempF, airTempF: inputs.weather.airTempF,
    densityAltitudeFt: r.derived.air?.densityAltitudeFt ?? null, driverWeightLb: inputs.driver.weightLb,
    recommended: Object.fromEntries(r.order.map(id => [id, r.fields[id].display ?? r.fields[id].value])),
    ran, laps: [], bestLap: null, engineGood: false, feel: inputs.feel.text, notes: '',
  });
  toast('Saved. Add lap times in the Log tab.');
}

async function fetchWeather(track, when) {
  const lat = track.location?.lat?.value, lon = track.location?.lon?.value;
  if (lat == null || lon == null) throw new Error('track has no coordinates');
  const date = when.slice(0, 10), hour = when.slice(0, 13);
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&hourly=temperature_2m,relative_humidity_2m,surface_pressure,precipitation&temperature_unit=fahrenheit&timezone=auto&start_date=${date}&end_date=${date}`;
  const res = await fetch(url);
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  const j = await res.json();
  const i = Math.max(0, j.hourly.time.findIndex(t => t.startsWith(hour)));
  return {
    time: j.hourly.time[i].replace('T', ' '),
    airTempF: Math.round(j.hourly.temperature_2m[i]),
    rhPct: Math.round(j.hourly.relative_humidity_2m[i]),
    pressureInHg: +(j.hourly.surface_pressure[i] / 33.8639).toFixed(2),
    precipMm: j.hourly.precipitation[i],
  };
}

function renderKart() {
  const root = $('#tab-kart'); root.replaceChildren(h('h2', {}, 'Kart profile'),
    h('p', { class: 'hint' }, 'Stored on this phone. Recommendations are changes from these numbers. Fields left blank are never guessed.'));
  const els = {};
  let card = null;
  for (const [key, label, type, opts] of PROFILE_FIELDS) {
    if (!label) { card = h('div', { class: 'card' }, h('h3', {}, key)); root.append(card); continue; }
    const v = profile[key];
    const el = type === 'select' ? h('select', { id: `p-${key}` }, h('option', { value: '' }, '—'), opts.map(o => h('option', { value: o, selected: o === v }, o)))
      : type === 'number' ? numberInput(`p-${key}`, v)
      : h('input', { id: `p-${key}`, value: Array.isArray(v) ? v.join(', ') : v ?? '', inputmode: type === 'list' ? 'decimal' : 'text' });
    els[key] = [el, type];
    card.append(h('label', { for: `p-${key}` }, label), el);
  }
  root.append(h('button', { class: 'btn', type: 'button', onclick: () => {
    for (const [key, [el, type]] of Object.entries(els)) profile[key] = type === 'number' ? num(el) : type === 'list' ? list(el) : el.value || null;
    toast(store.set('ka.profile', profile) ? 'Kart profile saved' : 'Could not save (storage blocked)');
  } }, 'Save kart profile'));
}

// ---------------- log tab ----------------
async function renderLog() {
  const root = $('#tab-log'); if (!kb) return;
  const track = inputs.track;
  const sessions = await db.listSessions(track);
  const learned = learn(sessions, track);
  root.replaceChildren(h('h2', {}, `Session log: ${kb.tracks[track].name}`),
    h('p', { class: 'hint' }, 'Change the track on the Setup tab. Tick "engine ran clean" on a good session to make it the jetting reference.'));
  if (learned.changes.length) root.append(h('div', { class: 'card' }, h('h3', {}, 'What helped here'),
    h('ul', { class: 'list' }, learned.changes.map(c => h('li', {}, c.text, ' ', h('span', { class: 'conf' }, c.strength)))),
    h('p', { class: 'hint' }, 'Evidence only: the app does not change its recommendations from this.')));
  if (learned.jetReference) root.append(h('p', { class: 'hint' }, `Jetting reference: #${learned.jetReference.jet} at ${learned.jetReference.densityAltitudeFt} ft DA (${learned.jetReference.date}).`));
  if (!sessions.length) root.append(h('p', {}, 'No sessions yet. Get a setup, then "Save to session log".'));
  for (const s of sessions) root.append(sessionCard(s));
  const importText = async text => {
    try { const n = await db.importJson(text); const p = JSON.parse(text).profile; if (p) { profile = p; store.set('ka.profile', p); renderKart(); } toast(`Imported ${n} sessions`); renderLog(); }
    catch (err) { toast(`Import failed: ${err.message}`); }
  };
  const file = h('input', { type: 'file', accept: 'application/json', class: 'sr-only', id: 'imp', onchange: async e => importText(await e.target.files[0].text()) });
  const backup = h('textarea', { id: 'backup', readonly: true, hidden: true, 'aria-label': 'Backup text' });
  const paste = h('textarea', { id: 'paste', placeholder: 'Paste backup text here' });
  root.append(h('div', { class: 'card' }, h('h3', {}, 'Backup'),
    h('p', { class: 'hint' }, 'Copy the backup text and keep it somewhere safe (notes app, email to yourself). Paste it back below to restore.'),
    h('button', { class: 'btn small', type: 'button', onclick: async () => {
      const data = JSON.parse(await db.exportJson()); data.profile = profile;
      const text = JSON.stringify(data, null, 2);
      backup.value = text; backup.hidden = false;
      try { await navigator.clipboard.writeText(text); toast('Backup copied'); }
      catch { backup.focus(); backup.select(); toast('Select all and copy the text below'); }
      if (!HOSTED()) {
        const a = h('a', { href: URL.createObjectURL(new Blob([text], { type: 'application/json' })), download: `kart-log-${new Date().toISOString().slice(0, 10)}.json` });
        document.body.append(a); a.click(); a.remove();
      }
    } }, 'Copy backup'),
    h('label', { for: 'imp', class: 'btn small secondary', style: 'display:inline-flex;align-items:center' }, 'Import file'), file,
    backup,
    h('label', { for: 'paste' }, 'Restore from pasted backup'), paste,
    h('button', { class: 'btn small secondary', type: 'button', onclick: () => importText(paste.value) }, 'Restore')));
}

function sessionCard(s) {
  const ranEls = {};
  const rows = LOGGED_FIELDS.map(f => { const el = h('input', { value: s.ran?.[f] ?? '', id: `r-${s.id}-${f}` }); ranEls[f] = el; return h('div', {}, h('label', { for: el.id }, f.replace(/_/g, ' ')), el); });
  const laps = h('textarea', { id: `l-${s.id}`, placeholder: 'Lap times, e.g. 32.41 32.18 32.05' }, (s.laps || []).join(' '));
  const good = h('input', { type: 'checkbox', id: `g-${s.id}`, checked: !!s.engineGood, style: 'width:28px;min-height:28px' });
  const notes = h('textarea', { id: `n-${s.id}`, placeholder: 'Notes / how it felt' }, s.notes || s.feel || '');
  const best = bestLap(s);
  return h('details', { class: 'card session' },
    h('summary', {}, `${s.date.replace('T', ' ')} · ${s.surface}${s.trackTempF != null ? `, ${s.trackTempF} °F track` : ''}${best != null ? ` · best ${best}` : ''}`),
    h('p', { class: 'hint' }, `Recommended: ${Object.entries(s.recommended || {}).filter(([, v]) => v != null && typeof v !== 'object').map(([k, v]) => `${k.replace(/_/g, ' ')} ${v}`).join(' · ')}`),
    h('h3', {}, 'What you actually ran'), h('div', { class: 'row' }, rows),
    h('label', { for: laps.id }, 'Lap times (s)'), laps,
    h('label', { for: good.id, style: 'display:flex;gap:10px;align-items:center' }, good, 'Engine ran clean (plug tan): use as jetting reference'),
    h('label', { for: notes.id }, 'Notes'), notes,
    h('button', { class: 'btn small', type: 'button', onclick: async () => {
      const ran = {};
      for (const [f, el] of Object.entries(ranEls)) ran[f] = el.value === '' ? null : Number.isFinite(Number(el.value)) ? Number(el.value) : el.value;
      const lapList = list(laps);
      await db.saveSession({ ...s, ran, laps: lapList, bestLap: lapList.length ? Math.min(...lapList) : null, engineGood: good.checked, notes: notes.value });
      toast('Session updated'); renderLog();
    } }, 'Save'),
    // Two taps instead of confirm(), which embedded viewers suppress.
    h('button', { class: 'btn small secondary', type: 'button', onclick: async e => {
      if (e.currentTarget.dataset.armed) { await db.deleteSession(s.id); renderLog(); return; }
      e.currentTarget.dataset.armed = '1'; e.currentTarget.textContent = 'Tap again to delete';
    } }, 'Delete'));
}

// ---------------- info tab ----------------
function renderInfo() {
  const root = $('#tab-info');
  const all = Object.values(kb.sourceIndex);
  const q = h('input', { id: 'srcq', type: 'search', placeholder: 'Filter sources' });
  const ul = h('ul', { class: 'list src' });
  const draw = () => ul.replaceChildren(...all.filter(s => !q.value || JSON.stringify(s).toLowerCase().includes(q.value.toLowerCase())).slice(0, 80)
    .map(s => h('li', {}, s.url && /^https?:/.test(s.url) ? h('a', { href: s.url, target: '_blank', rel: 'noopener' }, s.title || s.url) : s.title || s.id, ' ', h('span', { class: 'conf' }, conf(s.confidence)), s.notes ? h('div', {}, s.notes) : null)));
  q.addEventListener('input', draw); draw();
  root.replaceChildren(
    h('h2', {}, 'How this works'),
    h('div', { class: 'card' }, h('p', {}, 'The app starts from your kart profile and applies cited rules in order: track layout, conditions, air density for jetting, driver, then your feedback (at most two handling changes). Finally it checks every value against the selected rules and blocks anything illegal.'),
      h('p', {}, 'Young drivers come first: a new driver never gets a change that takes rear grip away (except to cure hop), and jetting rounds toward rich.'),
      h('p', { class: 'hint' }, `Knowledge base built ${kb.generated}. Most facts come from web search summaries; confidence labels say how much to trust each one.`)),
    h('h2', {}, 'Tracks: check trackside'),
    ...Object.values(kb.tracks).map(t => h('details', { class: 'card' }, h('summary', {}, t.name), h('p', {}, t.geometry_status), h('ul', { class: 'list' }, (t.inferred_items || []).map(i => h('li', {}, i))))),
    h('h2', {}, 'Sources'), q, ul);
}

// Start last, so every module-level constant above is initialised first.
init();

return {  };
})();
</script>
