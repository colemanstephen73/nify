<style>
/* Layout: website with a top nav; setup page is inputs (left) + setup sheet (right), stacking on phones.
   Type: Barlow Condensed for headings and the big setup numbers (timing-sheet feel), Atkinson Hyperlegible
   for body text (built for legibility, good in sunlight). */
:root {
  --bg: #f4f6f9; --surface: #ffffff; --ink: #11161d; --muted: #4a5563; --line: #d5dae1; --line-strong: #9aa4b2;
  --accent: #1f4fd1; --accent-ink: #ffffff; --accent-soft: #e6ecfb;
  --flag: #f2c200; --changed: #fff4c2; --good: #11703a; --good-soft: #e3f3e9; --warn: #8f5400; --warn-soft: #fff1dc;
  --bad: #b3261e; --bad-soft: #fde8e6; --focus: #f2a100;
  --font-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --font-body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --radius: 10px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1217; --surface: #161c24; --ink: #eef1f5; --muted: #a7b0bc; --line: #2b3440; --line-strong: #4b5768;
    --accent: #7aa2ff; --accent-ink: #0e1217; --accent-soft: #1c2a4a;
    --flag: #f2c200; --changed: #3a3210; --good: #57c785; --good-soft: #15301f; --warn: #f0b453; --warn-soft: #36270f;
    --bad: #ff7b72; --bad-soft: #3a1714; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1217; --surface: #161c24; --ink: #eef1f5; --muted: #a7b0bc; --line: #2b3440; --line-strong: #4b5768;
  --accent: #7aa2ff; --accent-ink: #0e1217; --accent-soft: #1c2a4a;
  --flag: #f2c200; --changed: #3a3210; --good: #57c785; --good-soft: #15301f; --warn: #f0b453; --warn-soft: #36270f;
  --bad: #ff7b72; --bad-soft: #3a1714; color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-padding-top: 120px; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.5 var(--font-body); }
h1, h2, h3 { font-family: var(--font-display); font-weight: 700; line-height: 1.1; text-wrap: balance; margin: 0; }
h1 { font-size: clamp(2rem, 5vw, 2.8rem); letter-spacing: .01em; }
h2 { font-size: 1.6rem; }
h3 { font-size: 1.25rem; }
p { margin: 0; }
a { color: var(--accent); }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.num, .value, table td { font-variant-numeric: tabular-nums; }
.skip { position: absolute; left: -999px; }
.skip:focus { left: 16px; top: 8px; z-index: 50; background: var(--surface); padding: 8px 12px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* ---------- header ---------- */
.site-inner { max-width: 1160px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header.site { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
header.site .site-inner { display: flex; align-items: center; gap: 24px; min-height: 64px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); }
.brand b { display: block; font: 700 1.35rem/1 var(--font-display); letter-spacing: .02em; }
.brand small { display: block; color: var(--muted); font-size: .8rem; }
.brand-mark { width: 30px; height: 30px; border-radius: 6px; flex: none;
  background: conic-gradient(var(--ink) 25%, var(--surface) 0 50%, var(--ink) 0 75%, var(--surface) 0) 0 0 / 15px 15px; border: 2px solid var(--ink); }
.site-nav { display: flex; gap: 4px; margin-left: auto; }
.site-nav a { display: flex; align-items: center; min-height: 44px; padding: 0 14px; border-radius: 8px; color: var(--muted); font-weight: 700; text-decoration: none; white-space: nowrap; }
.site-nav a:hover { color: var(--ink); background: var(--bg); }
.site-nav a[aria-current="page"] { color: var(--accent); background: var(--accent-soft); }
.theme-btn { display: grid; place-items: center; width: 44px; height: 44px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-size: 1.2rem; cursor: pointer; }
@media (max-width: 860px) {
  header.site .site-inner { gap: 8px; padding-top: 8px; }
  .theme-btn { margin-left: auto; }
  .site-nav { order: 3; width: 100%; margin: 0 -8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 6px; }
  .site-nav a { padding: 0 12px; }
}

/* ---------- page frame ---------- */
main { max-width: 1160px; margin: 0 auto; padding-block: 28px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.page-head { display: grid; gap: 6px; margin-bottom: 22px; }
.page-head p { color: var(--muted); max-width: 62ch; }
.eyebrow { font: 700 .8rem/1 var(--font-body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; }
.stack { display: grid; gap: 16px; }
.site-foot { border-top: 1px solid var(--line); color: var(--muted); font-size: .9rem; padding-block: 20px calc(20px + env(safe-area-inset-bottom, 0px)); }

/* ---------- forms ---------- */
fieldset { border: 0; margin: 0; padding: 0 0 18px; display: grid; gap: 10px; }
fieldset + fieldset { border-top: 1px solid var(--line); padding-top: 18px; }
legend { display: flex; align-items: baseline; gap: 10px; font: 700 1.2rem/1.2 var(--font-display); padding: 0; margin-bottom: 4px; }
legend .step { display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; background: var(--ink); color: var(--surface); font: 700 .85rem/1 var(--font-body); }
label, .label { font-weight: 700; font-size: .95rem; }
.hint { color: var(--muted); font-size: .88rem; font-weight: 400; }
input, select, textarea {
  width: 100%; min-height: 46px; font: inherit; color: var(--ink); background: var(--surface);
  border: 1px solid var(--line-strong); border-radius: 8px; padding: 8px 12px;
}
textarea { min-height: 84px; resize: vertical; }
.field { display: grid; gap: 4px; min-width: 0; }
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.grid-auto { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button, .chip {
  min-height: 44px; padding: 6px 14px; font: 700 .95rem var(--font-body); cursor: pointer;
  border: 1px solid var(--line-strong); border-radius: 999px; background: var(--surface); color: var(--ink);
}
.seg button { flex: 1 1 auto; }
.seg button[aria-pressed="true"], .chip[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip-group { display: grid; gap: 6px; }
.track-cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.track-card { text-align: left; min-height: 72px; padding: 12px; border-radius: 8px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); font: inherit; cursor: pointer; display: grid; gap: 2px; }
.track-card b { font: 700 1.2rem/1.1 var(--font-display); }
.track-card span { color: var(--muted); font-size: .85rem; }
.track-card[aria-pressed="true"] { border: 2px solid var(--accent); background: var(--accent-soft); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 20px; border-radius: 8px; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); font: 700 1rem var(--font-body); cursor: pointer; text-decoration: none; }
.btn.secondary { background: transparent; color: var(--accent); }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line-strong); }
.btn.block { width: 100%; }
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; }

/* ---------- setup layout ---------- */
.setup-grid { display: grid; gap: 24px; align-items: start; }
@media (min-width: 960px) {
  .setup-grid { grid-template-columns: minmax(340px, 400px) minmax(0, 1fr); }
  .setup-grid .inputs { position: sticky; top: 88px; max-height: calc(100vh - 104px); overflow: auto; }
}
.inputs .go { position: sticky; bottom: -20px; margin: 0 -20px -20px; padding: 14px 20px; background: var(--surface); border-top: 1px solid var(--line); border-radius: 0 0 var(--radius) var(--radius); }
.da { font-size: .9rem; color: var(--muted); }
.da b { color: var(--ink); }

/* ---------- results ---------- */
.empty { text-align: left; display: grid; gap: 12px; padding: 28px; border: 2px dashed var(--line-strong); border-radius: var(--radius); }
.result-head { display: grid; gap: 10px; margin-bottom: 14px; }
.pills { display: flex; flex-wrap: wrap; gap: 6px; }
.pill { display: inline-flex; align-items: center; gap: 6px; min-height: 30px; padding: 2px 10px; border-radius: 999px; background: var(--bg); border: 1px solid var(--line); font-size: .88rem; font-weight: 700; }
.pill.ok { background: var(--good-soft); color: var(--good); border-color: transparent; }
.pill.bad { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
.callout { border-radius: var(--radius); padding: 14px 16px; border-left: 5px solid; display: grid; gap: 6px; }
.callout ul { margin: 0; padding-left: 1.2rem; }
.callout.bad { background: var(--bad-soft); border-color: var(--bad); }
.callout.warn { background: var(--warn-soft); border-color: var(--warn); }
.callout.info { background: var(--accent-soft); border-color: var(--accent); }
.callout h3 { font-size: 1.1rem; }

.sheet { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.sheet-group { border-top: 1px solid var(--line); }
.sheet-group:first-child { border-top: 0; }
.sheet-group > h3 { padding: 12px 16px 6px; font-size: .85rem; font-family: var(--font-body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.row { border-top: 1px solid var(--line); }
.row > summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 14px; align-items: center; padding: 12px 16px; min-height: 56px; }
.row > summary::-webkit-details-marker { display: none; }
.row > summary:hover { background: var(--bg); }
.row.changed > summary { background: var(--changed); box-shadow: inset 4px 0 0 var(--flag); }
.row.blocked > summary { background: var(--bad-soft); box-shadow: inset 4px 0 0 var(--bad); }
.row .item { font-weight: 700; }
.row .why { grid-column: 1; color: var(--muted); font-size: .9rem; }
.row .val { grid-row: 1 / span 2; grid-column: 2; text-align: right; display: grid; justify-items: end; gap: 2px; }
.row .value { font: 700 1.55rem/1 var(--font-display); white-space: nowrap; }
.row .was { color: var(--muted); font-size: .82rem; white-space: nowrap; }
.tag { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: .78rem; font-weight: 700; background: var(--bg); border: 1px solid var(--line); white-space: nowrap; }
.tag.change { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.tag.urgent, .tag.blocked { background: var(--bad); color: #fff; border-color: var(--bad); }
.tag.rule { background: var(--good-soft); color: var(--good); border-color: transparent; }
.tag.need { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.row-body { padding: 4px 16px 16px; display: grid; gap: 10px; border-top: 1px dashed var(--line); background: var(--surface); }
.row-body ol, .row-body ul { margin: 0; padding-left: 1.2rem; display: grid; gap: 6px; font-size: .95rem; }
.conf { font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; white-space: nowrap; }
.src { font-size: .88rem; color: var(--muted); overflow-wrap: anywhere; }
.fixed-rows > summary { padding: 12px 16px; cursor: pointer; color: var(--muted); font-weight: 700; min-height: 48px; display: flex; align-items: center; }
.result-bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 15; display: none; background: var(--ink); color: var(--surface);
  padding-block: 12px calc(12px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.result-bar a { color: var(--surface); font-weight: 700; }
@media (max-width: 959px) { .result-bar.show { display: flex; justify-content: space-between; align-items: center; gap: 12px; } }

/* ---------- tables, log, tracks ---------- */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: .95rem; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: .8rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
dl.facts { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 16px; margin: 0; }
dl.facts dt { font-weight: 700; }
dl.facts dd { margin: 0; color: var(--muted); }
.track-layout { display: grid; gap: 20px; }
@media (min-width: 900px) { .track-layout { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }
.map { width: 100%; max-width: 100%; height: auto; background: var(--bg); border-radius: var(--radius); }
.session-row > summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; padding: 14px 16px; border-top: 1px solid var(--line); }
.session-row > summary::-webkit-details-marker { display: none; }
.session-row .row-body { border-top: 0; }
.meter { height: 8px; border-radius: 999px; background: var(--bg); overflow: hidden; border: 1px solid var(--line); }
.meter > span { display: block; height: 100%; background: var(--good); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(24px + env(safe-area-inset-bottom, 0px)); z-index: 40; background: var(--ink); color: var(--surface); padding: 12px 18px; border-radius: 10px; font-weight: 700; max-width: calc(100% - 32px); }
@media (prefers-reduced-motion: no-preference) { .row-body { animation: open .15s ease-out; } @keyframes open { from { opacity: 0; transform: translateY(-4px); } } }

</style>

// Air density and density altitude. Pure functions, SI units inside.
// Method: ISA troposphere (ICAO Doc 7488) + Tetens saturation vapour pressure.
// These are standard physics, not kart-specific; sources are listed in data/air.yaml.

const ISA = {
  T0: 288.15,          // K, sea-level temperature
  P0: 1013.25,         // hPa, sea-level pressure
  rho0: 1.225,         // kg/m³, sea-level density
  L: 0.0065,           // K/m, lapse rate
  g: 9.80665,          // m/s²
  Rd: 287.058,         // J/(kg·K), dry air
  Rv: 461.495,         // J/(kg·K), water vapour
};
const EXP = ISA.g / (ISA.Rd * ISA.L);      // ≈ 5.2559 (pressure exponent)

const fToC = f => (f - 32) * 5 / 9;
const cToF = c => c * 9 / 5 + 32;
const inHgToHpa = x => x * 33.8639;
const hpaToInHg = x => x / 33.8639;
const ftToM = x => x * 0.3048;
const mToFt = x => x / 0.3048;

// Saturation vapour pressure over water, hPa (Tetens 1930).
function saturationVaporPressure(tC) {
  return 6.1078 * Math.pow(10, (7.5 * tC) / (tC + 237.3));
}

// Station (absolute) pressure from a sea-level-reduced reading such as a
// weather-report "barometer" / altimeter setting, hPa.
function stationPressureFromSeaLevel(seaLevelHpa, elevationM) {
  return seaLevelHpa * Math.pow(1 - (ISA.L * elevationM) / ISA.T0, EXP);
}

// Air density in kg/m³ from station pressure (hPa), temperature (°C), relative humidity (0–100).
function airDensity({ stationPressureHpa, tempC, rhPct }) {
  const T = tempC + 273.15;
  const pv = (Math.max(0, Math.min(100, rhPct)) / 100) * saturationVaporPressure(tempC);
  const pd = stationPressureHpa - pv;
  return (pd * 100) / (ISA.Rd * T) + (pv * 100) / (ISA.Rv * T);
}

// Altitude in the ISA at which density equals `rho`. Returns metres.
function densityAltitudeFromDensity(rho) {
  return (ISA.T0 / ISA.L) * (1 - Math.pow(rho / ISA.rho0, 1 / (EXP - 1)));
}

// ISA density at a given density altitude (m). Inverse of densityAltitudeFromDensity.
function densityFromDensityAltitude(hM) {
  return ISA.rho0 * Math.pow(1 - (ISA.L * hM) / ISA.T0, EXP - 1);
}

// and is used to estimate station pressure when pressure is missing entirely.
function airState({ tempC, rhPct, pressure, elevationM }) {

    pressureNote = 'station pressure entered';

    pressureNote = 'converted from sea-level pressure using track elevation';
  } else {
    if (elevationM == null) throw new Error('no pressure and no elevation');
    stationPressureHpa = stationPressureFromSeaLevel(ISA.P0, elevationM);
    pressureNote = 'no pressure given: assumed standard-day pressure at track elevation';

  const rho = airDensity({ stationPressureHpa, tempC, rhPct: rhPct ?? 50 });
  const daM = densityAltitudeFromDensity(rho);

    stationPressureHpa, rho,
    relativeDensity: rho / ISA.rho0,
    densityAltitudeM: daM,
    densityAltitudeFt: mToFt(daM),
    pressureNote,
    humidityAssumed: rhPct == null,
  };
}

    if (!pressure) verify.push(`Pressure not entered: ${air.pressureNote}.`);
  }
  const trackTempF = w.trackTempF ?? w.airTempF ?? null;
  if (w.trackTempF == null && w.airTempF != null) notes.push('Track temperature not entered: using air temperature. A sunny track is usually much hotter. An IR thermometer reading helps.');

  const G = A.grip_model;
  const surface = inputs.surface || 'dry', rubber = inputs.rubber || 'medium', tireAge = inputs.tires?.age || 'scuffed';
  let grip = G.base + (G.surface[surface] ?? 0) + (G.rubber[rubber] ?? 0) + (G.tire_age[tireAge] ?? 0);
  if (trackTempF != null) grip += G.track_temp_f.find(b => trackTempF < b.below)?.add ?? 0;
  grip = round(Math.max(0, Math.min(1, grip)));
  const gripBand = grip < G.low_below ? 'low' : grip >= G.high_at_or_above ? 'high' : 'normal';

  const config = (track.configurations || []).find(c => c.id === inputs.configuration) || track.configurations?.[0];
  const demands = config?.corners?.length ? summarizeDemands(config.corners, config.length_m ?? config.corners.reduce((s, c) => s + c.lengthM + c.precedingStraightM, 0)) : null;

  // ---------- levers & moves ----------
  const moves = [];
  const lever = id => A.levers[id];
  const leverExists = id => {
    const l = lever(id);
    if (!l) return false;
    if (A.not_recommended.includes(id)) return false;
    const ex = l.chassis_ref ? C.adjustments?.[l.chassis_ref]?.exists : true;
    if (ex !== true) return false;
    if (id === 'rear_hub_length') return kart.rearHubMm != null && (kart.hubOptionsMm?.length ?? 0) > 1;
    return true;
  };
  const floor = A.driver.rear_grip_floor[driver.experience] || 'all';
  const reducesRear = (id, steps) => (lever(id).grip_effect?.rear ?? 0) * steps < 0;
  const allowed = (id, steps, stage, tag) => {
    if (!leverExists(id)) return false;
    if (lever(id).novice_allowed === false && driver.experience !== 'experienced') return false;
    if (reducesRear(id, steps) && tag !== 'hop') {
      if (floor === 'all') return false;
      if (floor === 'conditions' && stage === 'conditions') return false;
    }
    // Option levers: stay within what the crew owns.
    if (id === 'rear_hub_length') { const o = [...kart.hubOptionsMm].sort((a, b) => a - b), i = o.indexOf(kart.rearHubMm); return i + steps >= 0 && i + steps < o.length; }
    if (id === 'ballast_height') { const o = lever(id).options, i = o.indexOf(kart.ballastHeight || 'low'); return i + steps >= 0 && i + steps < o.length; }
    return true;
  };
  const move = (id, steps, stage, text, sources, confidence, tag = null) => moves.push({ lever: id, steps, stage, text, sources, confidence, tag });

  // ---------- 1. baseline ----------
  field('front_tire_pressure', lever('front_tire_pressure').label, 'psi', kart.frontPressurePsi);
  field('rear_tire_pressure', lever('rear_tire_pressure').label, 'psi', kart.rearPressurePsi);
  field('front_track_width', lever('front_track_width').label, 'in', kart.frontTrackWidthIn);
  field('rear_track_width', lever('rear_track_width').label, 'in', kart.rearTrackWidthIn);
  field('rear_hub_length', lever('rear_hub_length').label, 'mm', kart.rearHubMm);
  field('seat_fore_aft', lever('seat_fore_aft').label, 'in', kart.seatPositionIn);
  field('ballast_height', lever('ballast_height').label, '', kart.ballastHeight || null);

  // ---------- 2. track demands → gearing ----------
  const gearRule = merged.byField.axle_sprocket;
  const gearKb = A.gearing;
  const gear = field('axle_sprocket', 'Axle sprocket (gear)', 'teeth', kart.axleSprocket ?? null);
  if (kart.axleSprocket == null) {
    gear.baseline = gearKb.baseline.value; gear.value = gear.baseline; gear.status = 'kept';
    step('axle_sprocket', 'baseline', `No gear entered: start from ${gearKb.driver.value}/${gearKb.baseline.value}, WKA's suggested Comer kid kart gear`, ref('advisor', gearKb.baseline.sources), gearKb.baseline.confidence);
  }
  let gearShift = 0;
  if (gearRule?.eq) {
    gear.status = 'fixed_by_rule';
    step('axle_sprocket', 'track', `Spec gear at this track: ${gearRule.eq.value} teeth (${gearRule.eq.layer}). Track layout doesn't change it.`, gearRule.eq.sources, 'track_official');
  } else if (!demands) {
    step('axle_sprocket', 'track', `No corner geometry for ${track.short_name || track.name} yet, so the gear isn't adjusted for the layout`, ref(track.fileKey, config?.sources || []), 'unknown');
  } else if (demands.character === 'balanced') {
    step('axle_sprocket', 'track', `Layout is balanced (${demands.tightCount} tight, ${demands.fastCount} fast of ${demands.cornerCount} corners; longest straight ${Math.round(mToFt(demands.longestStraightM))} ft): no gear change for the track`, ref(track.fileKey, config.sources || []), 'inferred');
  } else {
    gearShift = demands.character === 'acceleration' ? gearKb.demand_shift_teeth.value : -gearKb.demand_shift_teeth.value;
    step('axle_sprocket', 'track', demands.character === 'acceleration'
      ? `Mostly tight corners (${demands.tightCount} of ${demands.cornerCount}): ${gearShift} teeth for acceleration off the corners`
      : `Fast, flowing layout: ${gearShift} teeth for top speed (longest straight ${Math.round(mToFt(demands.longestStraightM))} ft)`,
    [...ref(track.fileKey, config.sources || []), ...ref('advisor', gearKb.demand_shift_teeth.sources)], 'inferred', gearShift);
  }

  // ---------- 3. conditions ----------
  const condReasonGrip = `Grip estimate ${round(grip)} (${surface}, ${rubber} track, ${tireAge} tires${trackTempF != null ? `, track ${Math.round(trackTempF)} °F` : ''})`;
  const Cn = A.conditions;
  if (gripBand === 'low') for (const ch of Cn.low_grip.changes) {
    if (allowed(ch.lever, ch.steps, 'conditions')) move(ch.lever, ch.steps, 'conditions', `${condReasonGrip}: ${Cn.low_grip.reason.toLowerCase()}`, ref('advisor', Cn.low_grip.sources), Cn.low_grip.confidence);
  }
  if (gripBand === 'high') for (const ch of Cn.high_grip.changes) {
    if (Cn.high_grip.experienced_only && driver.experience !== 'experienced') { notes.push(`${condReasonGrip}: high grip. The rear isn't freed up for a ${driver.experience} driver. If the kart hops or feels stuck, report it in "how did it feel".`); continue; }
    if (allowed(ch.lever, ch.steps, 'conditions')) move(ch.lever, ch.steps, 'conditions', `${condReasonGrip}: ${Cn.high_grip.reason.toLowerCase()}`, ref('advisor', Cn.high_grip.sources), Cn.high_grip.confidence);
  }
  if (trackTempF != null) {
    const band = Cn.pressure_by_track_temp_f.bands.find(b => trackTempF < b.below);
    // Not subject to the rear-grip floor: on a cold day more pressure builds tire heat, which adds grip.
    if (band && band.steps) for (const id of ['front_tire_pressure', 'rear_tire_pressure']) {
      if (leverExists(id)) move(id, band.steps, 'conditions', `Track ${Math.round(trackTempF)} °F. ${band.steps > 0 ? Cn.pressure_by_track_temp_f.reason_cold : Cn.pressure_by_track_temp_f.reason_hot}`, ref('advisor', Cn.pressure_by_track_temp_f.sources), Cn.pressure_by_track_temp_f.confidence);
    }
  }
  if (surface === 'wet') notes.push(Cn.wet.note);

  // Tires (rule-driven)
  const tireRule = merged.byField.tire_spec;
  const tireWanted = surface === 'wet' ? (tireRule?.one_of?.value.find(t => /rain/i.test(t)) ?? 'rain tires (if you have them)') : (inputs.tires?.brand || tireRule?.one_of?.value.find(t => !/rain/i.test(t)) || null);
  const tires = field('tire_spec', 'Tires', '', inputs.tires?.brand || null);
  tires.value = tireWanted; tires.status = tireWanted ? 'set' : 'relative';
  if (tireRule?.one_of) step('tire_spec', 'conditions', `${surface === 'wet' ? 'Wet: rain tire' : 'Dry: slick'} per the tire rule (${tireRule.one_of.value.join(' / ')})`, tireRule.one_of.sources, 'track_official');
  else step('tire_spec', 'conditions', `No tire rule for this rule set (${(tireRule?.notes || []).map(n => n.value).join('; ') || 'not found'}).${surface === 'wet' ? ' Use rain tires if you have them.' : ''}`, tireRule?.notes?.[0]?.sources || ref('chassis', ['badger']), tireRule ? 'track_official' : 'unknown');

  // ---------- 4. air density → jetting ----------
  const J = A.jetting;
  const jetsAvail = (kart.jetsOwned?.length ? kart.jetsOwned : J.available.value).slice().sort((a, b) => a - b);
  const jet = field('main_jet', 'Main jet', '#', kart.mainJet ?? null);
  const jetRef = kart.jetReference;
  if (kart.mainJet == null) {
    jet.baseline = J.fallback_jet.value; jet.value = jet.baseline; jet.status = 'kept';
    step('main_jet', 'baseline', `No jet entered: start at #${J.fallback_jet.value}, the richer common choice (a bare SHA 14/12L ships with #57). Read the plug after the first session.`, ref('advisor', J.fallback_jet.sources), J.fallback_jet.confidence);
  }
  if (air && jetRef?.jet != null && jetRef?.densityAltitudeFt != null) {
    const rhoRef = densityFromDensityAltitude(ftToM(jetRef.densityAltitudeFt));
    const target = jetRef.jet * Math.pow(air.rho / rhoRef, J.number_exponent.value);
    const base = Math.floor(target), pick = target - base >= J.round_up_from.value ? base + 1 : base;
    const snapped = jetsAvail.reduce((b, x) => (Math.abs(x - pick) < Math.abs(b - pick) || (Math.abs(x - pick) === Math.abs(b - pick) && x > b) ? x : b), jetsAvail[0]);
    const change = snapped - jet.value;
    jet.status = 'set';
    step('main_jet', 'air', `Density altitude ${Math.round(air.densityAltitudeFt)} ft vs ${Math.round(jetRef.densityAltitudeFt)} ft when #${jetRef.jet} ran right. Air ${air.rho > rhoRef ? 'denser: needs more fuel' : 'thinner: needs less fuel'}. Exact ${target.toFixed(2)} → #${snapped} (rounded toward rich${kart.jetsOwned?.length ? ', from jets you own' : ''})${change === 0 ? ': no change' : ''}.`,
      [...ref('carb', ['engtips', 'longacre', 'ducati_dellorto']), ...ref('advisor', J.round_up_from.sources)], 'inferred', change, { set: snapped });
  } else if (air) {
    step('main_jet', 'air', `Density altitude ${Math.round(air.densityAltitudeFt)} ft today. No reference session yet, so the jet isn't changed for the weather. After a session where the engine runs clean and the plug reads tan, mark it as the jetting reference.`, ref('carb', ['longacre', 'engtips']), 'inferred');
  } else {
    step('main_jet', 'air', 'No weather entered, so jetting not checked against air density', ref('carb', ['longacre']), 'unknown');
  }

  // ---------- 5. driver ----------
  const minW = merged.byField.min_weight_lb?.min;
  const ballast = field('ballast_lb', 'Ballast', 'lb', kart.ballastLb ?? null);
  if (minW) {
    if (kart.weightLb != null && driver.weightLb != null) {
      const margin = A.driver.ballast_margin_lb.value;
      const need = Math.max(0, Math.ceil(minW.value + margin - kart.weightLb - driver.weightLb));
      ballast.value = need; ballast.status = 'set'; ballast.delta = kart.ballastLb != null ? need - kart.ballastLb : null;
      step('ballast_lb', 'driver', `Minimum ${minW.value} lb kart + driver (${minW.layer}). Kart ${kart.weightLb} lb + driver ${driver.weightLb} lb = ${kart.weightLb + driver.weightLb} lb. ${need ? `Add ${need} lb (includes a ${margin} lb margin for fuel burn and scale differences).` : 'Already over the minimum with margin: no ballast needed.'}`,
        [...minW.sources, ...ref('advisor', A.driver.ballast_margin_lb.sources)], 'track_official', ballast.delta);
    } else {
      ballast.status = 'withheld';
      step('ballast_lb', 'driver', `Minimum ${minW.value} lb kart + driver (${minW.layer}). Enter the kart's ready-to-race weight (no driver) and the driver's suited-up weight to work out ballast.`, minW.sources, 'track_official');
    }
  } else {
    step('ballast_lb', 'driver', `No minimum weight in this rule set (${(merged.byField.min_weight_lb?.notes || []).map(n => n.value).join('; ') || 'none found'}). Ballast only if you use it for balance.`, merged.byField.min_weight_lb?.notes?.[0]?.sources || [USER], 'track_official');
  }
  step('ballast_lb', 'driver', 'Mount it low and central: low ballast keeps the kart stable', ref('chassis', ['ballast_guides']), 'expert_consensus');
  if (driver.experience !== 'experienced') notes.push(`${driver.experience[0].toUpperCase() + driver.experience.slice(1)} driver: no change is allowed to take rear grip away below your baseline${floor === 'conditions' ? ' because of the conditions' : ''}. A slightly hooked-up kart is easier to drive than a loose one.`);

  // ---------- 6. feel feedback ----------
  const feel = parseFeel(inputs.feel?.text || '', inputs.feel?.chips || []);
  const F = A.feel;
  const conflictedPhases = new Set(['entry', 'mid', 'exit'].filter(ph => feel.tags.includes(`understeer_${ph}`) && feel.tags.includes(`oversteer_${ph}`)));
  const ordered = F.priority.filter(t => feel.tags.includes(t));
  const next = [];
  const feelUsed = new Set();         // one feel change per lever per session
  let handling = 0;
  const feelSrc = fix => [...ref('advisor', lever(fix.lever).sources), ...ref('advisor', F.sources).filter(s => !s.endsWith(':policy'))];
  for (const tag of ordered) {
    if (!(tag in F.fixes)) continue;
    const phase = tag.split('_')[1];
    if (conflictedPhases.has(phase) && /steer/.test(tag)) continue;
    const options = F.fixes[tag].filter(f => allowed(f.lever, f.steps, 'feel', tag) && !feelUsed.has(f.lever));
    if (!options.length) { next.push({ tag, text: `${TAGS[tag]}: no available change on this kart for a ${driver.experience} driver. Check driver line and seat fit.` }); continue; }
    if (handling >= F.max_handling_changes) { next.push({ tag, text: `${TAGS[tag]}: after this session, try ${describeMove(options[0])}`, lever: options[0].lever }); continue; }
    const fix = options[0];
    move(fix.lever, fix.steps, 'feel', `You reported: ${TAGS[tag].toLowerCase()}. ${describeMove(fix)}: ${fix.steps > 0 ? lever(fix.lever).plus_effect : lever(fix.lever).minus_effect}`, feelSrc(fix), lever(fix.lever).confidence, tag);
    feelUsed.add(fix.lever);
    handling++;
    if (options[1]) next.push({ tag, text: `If still a problem (${TAGS[tag].toLowerCase()}): ${describeMove(options[1])}`, lever: options[1].lever });
  }
  function describeMove(f) {
    const l = lever(f.lever);
    if (f.lever === 'rear_hub_length') return `${f.steps > 0 ? 'longer' : 'shorter'} rear hubs`;
    if (f.lever === 'ballast_height') return `move ballast ${f.steps < 0 ? 'lower' : 'higher'}`;
    return `${f.steps > 0 ? '+' : '−'}${l.step_text} ${l.label.toLowerCase()}`;
  }

  // Carb feel changes (separate budget, lean overrides because it can seize the engine).
  const carbSyms = kb.carb.symptoms || [];
  const sym = tag => carbSyms.find(s => s.tag === tag);
  const carbConflict = feel.tags.includes('rich') && feel.tags.includes('lean');
  if (carbConflict) next.push({ tag: 'rich', text: 'Rich and lean both reported: do a plug chop before changing the jet. Stay on the richer side meanwhile.' });
  else if (feel.tags.includes('lean')) {
    const s = sym('lean_ping');
    step('main_jet', 'feel', `LEAN signs reported: ${s.fix}`, ref('carb', s.sources), s.confidence, 1, { urgent: true });
  } else if (feel.tags.includes('rich')) {
    const s = sym('rich_top_end');
    step('main_jet', 'feel', `Rich signs reported: ${s.fix}`, ref('carb', s.sources), s.confidence, -1);
  } else if (feel.tags.includes('bog')) {
    next.push({ tag: 'bog', text: `Bog: rich or lean? Rich = sluggish and smoky, wet black plug. Lean = hesitates, nearly dies, then surges. ${sym('rich_bog').fix}. Not changing the jet until you know which.` });
  }
  if (feel.tags.includes('tops_out')) {
    if (gear.status === 'fixed_by_rule') next.push({ tag: 'tops_out', text: 'Revs out on the straight, but the gear is fixed by the rules here.' });
    else { gearShift += gearKb.tops_out_teeth.value; step('axle_sprocket', 'feel', `Revs out before the end of the straight: ${gearKb.tops_out_teeth.value} teeth`, ref('advisor', gearKb.tops_out_teeth.sources), 'inferred', gearKb.tops_out_teeth.value); }
  }

  // ---------- 7. resolve moves → values, clamp, legality ----------
  for (const m of moves) {
    const f = fields[m.lever], l = lever(m.lever);
    let change;
    if (l.options) {
      const opts = m.lever === 'rear_hub_length' ? [...kart.hubOptionsMm].sort((a, b) => a - b) : l.options;
      const cur = f.value ?? (m.lever === 'ballast_height' ? 'low' : null);
      const i = opts.indexOf(cur), j = Math.max(0, Math.min(opts.length - 1, i + m.steps));
      change = `${cur} → ${opts[j]}`; f.value = opts[j];
    } else {
      change = round(m.steps * l.step, 2);
      f.delta = round((f.delta || 0) + change, 2);
      if (f.baseline != null) f.value = round(f.baseline + f.delta, 2);
    }
    f.status = f.baseline == null && !l.options ? 'relative' : 'set';
    step(m.lever, m.stage, m.text, m.sources, m.confidence, change, m.tag ? { tag: m.tag } : {});
  }
  for (const id of HANDLING_LEVERS) {
    const f = fields[id];
    if (!f.steps.length) step(id, 'baseline', leverExists(id) ? (f.baseline == null ? 'No change recommended today (add it to your kart profile to track it)' : 'No rule changed this today: keep your baseline') : notAvailableText(id), leverExists(id) ? [USER] : ref('chassis', C.adjustments?.[lever(id).chassis_ref]?.sources || []), leverExists(id) ? 'user' : (C.adjustments?.[lever(id).chassis_ref]?.confidence || 'unknown'));
    if (!leverExists(id) && !f.steps.some(s => s.stage !== 'baseline')) f.status = id === 'rear_hub_length' ? 'withheld' : f.baseline == null ? 'not_adjustable' : f.status;
    if (f.status === 'relative' && f.delta === 0) f.status = 'withheld';
  }
  function notAvailableText(id) {
    if (id === 'rear_hub_length') return 'Hub length changes need your current hub length and the hub lengths you own (kart profile)';
    return `Not confirmed adjustable on this chassis: ${C.adjustments?.[lever(id).chassis_ref]?.notes || 'research found no adjuster'}`;
  }

  // Gear: apply shift, cap, snap to owned sprockets, then rules.
  if (gear.status !== 'fixed_by_rule' && gearShift) {
    const cap = gearKb.max_shift_teeth.value, centre = gearKb.baseline.value;
    let v = gear.baseline + gearShift;
    v = Math.max(centre - cap, Math.min(centre + cap, v));
    if (kart.sprocketsOwned?.length) v = kart.sprocketsOwned.reduce((b, x) => (Math.abs(x - v) < Math.abs(b - v) ? x : b));
    if (v !== gear.baseline + gearShift) step('axle_sprocket', 'clamp', `Kept within ±${cap} teeth of ${centre}${kart.sprocketsOwned?.length ? ' and to a sprocket you own' : ''}: ${v}`, ref('advisor', gearKb.max_shift_teeth.sources), 'inferred');
    gear.value = v; gear.delta = v - gear.baseline; gear.status = 'set';
  }
  const driverSprocket = merged.byField.driver_sprocket?.eq?.value ?? kart.driverSprocket ?? gearKb.driver.value;

  // Jet: sum the set/feel steps, keep inside owned/available jets.
  {
    const s = jet.steps.find(x => x.set != null);
    let v = s ? s.set : jet.value;
    const feelStep = jet.steps.find(x => x.stage === 'feel');
    if (feelStep) {
      const idx = jetsAvail.indexOf(v), j = Math.max(0, Math.min(jetsAvail.length - 1, (idx < 0 ? jetsAvail.findIndex(x => x >= v) : idx) + feelStep.change));
      v = jetsAvail[j]; jet.status = 'set';
    }
    jet.delta = v - jet.baseline; jet.value = v;
  }

  // Legality: enforce every output that has a rule.
  const legal = (id, ruleField, value) => {
    const r = merged.byField[ruleField];
    if (!r) return;
    const e = enforce(value, r);
    for (const a of e.adjustedBy) step(id, 'legality', `Changed from ${a.from} to meet the rules: ${a.op} ${Array.isArray(a.value) ? a.value.join('/') : a.value} (${a.layer})`, a.sources, 'track_official');
    if (e.blocked) { fields[id].value = null; fields[id].status = 'blocked'; step(id, 'legality', `BLOCKED: ${e.blocked}`, Object.values(r).flatMap(x => x?.sources || []), 'track_official'); }
    else { fields[id].value = e.value; if (e.adjustedBy.length) fields[id].delta = typeof e.value === 'number' && typeof fields[id].baseline === 'number' ? e.value - fields[id].baseline : fields[id].delta; }
    fields[id].legality = { ok: !e.blocked, rule: describe(r) };
  };
  legal('axle_sprocket', 'axle_sprocket', gear.value);
  legal('main_jet', 'main_jet', jet.value);
  legal('tire_spec', 'tire_spec', tires.value && tireRule?.one_of ? tires.value : null);
  legal('front_tire_pressure', 'tire_pressure_psi', fields.front_tire_pressure.value);
  legal('rear_tire_pressure', 'tire_pressure_psi', fields.rear_tire_pressure.value);

  // ---------- fixed / reference rows ----------
  const gearRow = fields.axle_sprocket;
  gearRow.display = gearRow.value != null ? `${driverSprocket}/${gearRow.value}` : null;
  gearRow.ratio = gearRow.value ? round(gearRow.value / driverSprocket, 2) : null;
  step('axle_sprocket', 'rules', `Clutch drum ${driverSprocket} teeth, #219 chain`, merged.byField.driver_sprocket?.eq?.sources || ref('engine', ['wka_tm_2022_002_pdf']), 'sanctioning_body');

  const carbOther = field('carb_other', 'Other carb settings', '', null);
  carbOther.value = 'None to set'; carbOther.status = 'not_adjustable';
  step('carb_other', 'baseline', `${kb.carb.idle.needle_clip.value}; ${kb.carb.idle.idle_jet_or_mixture_screw.value}. The main jet is the only fuel adjustment.`, ref('carb', kb.carb.idle.needle_clip.sources), kb.carb.idle.needle_clip.confidence);
  step('carb_other', 'baseline', `Float stamped ${kb.carb.float.weight_g.value} g; float level unknown. WKA: carb parts must stay as cast.`, [...ref('carb', kb.carb.float.weight_g.sources), ...ref('carb', ['wka_tm_2022_002'])], 'anecdote');

  const plug = field('spark_plug', 'Spark plug', '', kart.sparkPlug || null);
  const cand = kb.engine.spark_plug.candidates;
  if (kart.sparkPlug) step('spark_plug', 'baseline', `Keep it: no sourced C52 plug spec to change it to. Read it after each session (tan = good).`, ref('carb', ['kartpulse_plug']), 'anecdote');
  else { plug.status = 'withheld'; plug.value = null; step('spark_plug', 'baseline', `C52 plug not published. Plugs allowed for the C50 (inferred to fit): ${cand.value.join(', ')}. Check with your engine builder.`, ref('engine', cand.sources), cand.confidence); }

  const fuel = field('fuel_mix', 'Fuel and oil', '', null);
  const fuelRule = merged.byField.fuel;
  const ratios = kb.engine.fuel_mix.ratio_options;
  const fuelText = fuelRule?.eq ? fuelRule.eq.value : fuelRule?.one_of ? fuelRule.one_of.value.join(' or ') : (kart.fuel || 'open (no fuel rule)');

async function engineInputs() {
  const sessions = await db.listSessions(inputs.track);
  const learned = learn(sessions, inputs.track);
  const jetReference = profile.jetRefJet != null && profile.jetRefDaFt != null ? { jet: profile.jetRefJet, densityAltitudeFt: profile.jetRefDaFt } : learned.jetReference;
  return { ei: { ...structuredClone(inputs), kart: { ...profile, jetReference } }, learned };
}

async function run(scroll) {
  const out = $('#result'); if (!out) return;
  const { ei, learned } = await engineInputs();
  let r;
  try { r = recommend(kb, ei); }
  catch (e) { out.replaceChildren(h('p', { class: 'callout bad' }, `Could not work out a setup: ${e.message}`)); return; }
  lastResult = r;
  out.replaceChildren(...renderSheet(r, learned));
  const changes = r.order.filter(id => isChanged(r.fields[id])).length;
  const bar = $('#result-bar');
  bar.replaceChildren(h('span', {}, `Setup ready · ${changes} change${changes === 1 ? '' : 's'}${r.legality.ok ? '' : ' · check rules'}`), h('a', { href: '#result', onclick: e => { e.preventDefault(); out.scrollIntoView({ behavior: 'smooth' }); } }, 'View sheet ↓'));
  if ('IntersectionObserver' in window && !bar._io) { bar._io = new IntersectionObserver(([en]) => bar.classList.toggle('show', !en.isIntersecting)); bar._io.observe(out); }
  if (scroll) out.scrollIntoView({ behavior: 'smooth' });
}

const isChanged = f => f.status === 'relative' ? f.delta !== 0 : f.status === 'set' && f.baseline != null && f.value !== f.baseline;

function renderSheet(r, learned) {
  const L = r.legality, d = r.derived;
  const issues = [...L.blocked.map(b => `${r.fields[b].label}: no legal value under ${r.ruleSet.name}.`), ...L.currentIssues.map(i => i.text), ...L.conflicts.map(c => `Rule layers disagree: ${c}`)];
  const els = [h('div', { class: 'result-head' },
    h('h2', {}, `Setup sheet · ${r.track.name}`),
    h('div', { class: 'pills' },
      h('span', { class: `pill ${issues.length ? 'bad' : 'ok'}` }, issues.length ? `Check rules (${issues.length})` : 'Legal'),
      d.air ? h('span', { class: 'pill' }, `DA ${d.air.densityAltitudeFt.toLocaleString()} ft`) : h('span', { class: 'pill' }, 'No weather yet'),
      h('span', { class: 'pill' }, `Grip ${d.gripBand}`),
      h('span', { class: 'pill' }, r.track.geometry === 'available' ? `${d.demands.cornerCount} corners · ${d.demands.character.replace('_', ' ')}` : 'No corner data'),
      L.totalWeightLb != null ? h('span', { class: 'pill' }, `${L.totalWeightLb} lb with ballast`) : null),
    h('p', { class: 'hint' }, `Rules: ${r.ruleSet.name}`))];
  if (issues.length) els.push(h('div', { class: 'callout bad', role: 'alert' }, h('h3', {}, 'Check before going out'), h('ul', {}, issues.map(t => h('li', {}, t)))));
  if (r.notes.length) els.push(h('div', { class: 'callout warn', style: 'margin-top:12px' }, h('ul', {}, r.notes.map(n => h('li', {}, n)))));

  const sheet = h('div', { class: 'sheet', style: 'margin-top:16px' });
  for (const [title, ids] of GROUPS) {
    const fs = ids.map(id => r.fields[id]).filter(Boolean);
    const active = fs.filter(f => f.status !== 'not_adjustable'), fixed = fs.filter(f => f.status === 'not_adjustable');
    sheet.append(h('section', { class: 'sheet-group' }, h('h3', {}, title), active.map(sheetRow),
      fixed.length ? h('details', { class: 'fixed-rows row' }, h('summary', {}, `Not adjustable on this kart (${fixed.length}): ${fixed.map(f => f.label).join(', ')}`), fixed.map(sheetRow)) : null));
  }
  els.push(sheet);

  els.push(h('div', { class: 'panel stack', style: 'margin-top:16px' }, h('h3', {}, 'What to change next'),
    r.next.length ? h('ol', { style: 'margin:0;padding-left:1.2rem;display:grid;gap:6px' }, r.next.map(n => h('li', {}, n.text)))
      : h('p', {}, r.feel.tags.length ? 'Run the changes above, then report back.' : 'Run a session, then tap how the kart felt in step 5.'),
    r.feel.notUnderstood.length ? h('p', { class: 'hint' }, `Not understood: “${r.feel.notUnderstood.join('”, “')}”. Try the buttons in step 5.`) : null,
    r.feel.conflicts.length ? h('p', { class: 'hint' }, r.feel.conflicts.join(' ')) : null));
  if (learned?.changes.length) els.push(h('div', { class: 'panel stack', style: 'margin-top:16px' }, h('h3', {}, `What helped before at ${r.track.name}`),
    h('ul', { style: 'margin:0;padding-left:1.2rem' }, learned.changes.slice(0, 6).map(c => h('li', {}, c.text, ' ', h('span', { class: 'conf' }, c.strength))))));
  if (r.verify.length) els.push(h('details', { class: 'panel', style: 'margin-top:16px' }, h('summary', { style: 'cursor:pointer;font-weight:700' }, `Check trackside (${r.verify.length})`),
    h('ul', { style: 'margin:10px 0 0;padding-left:1.2rem;display:grid;gap:6px' }, r.verify.map(v => h('li', {}, v)))));
  els.push(h('div', { class: 'btn-row', style: 'margin-top:16px' }, h('button', { class: 'btn', type: 'button', onclick: saveToLog }, 'Save to session log'), h('a', { class: 'btn ghost', href: '#kart' }, 'Edit my kart')));
  return els;
}

function sheetRow(f) {
  let main, tag;
  if (f.status === 'blocked') { main = 'Blocked'; tag = h('span', { class: 'tag blocked' }, 'not legal'); }
  else if (f.status === 'withheld') { main = 'Need info'; tag = h('span', { class: 'tag need' }, 'add to My kart'); }
  else if (f.status === 'relative' && typeof f.delta === 'number' && f.delta !== 0) { main = `${f.delta > 0 ? '+' : '−'}${Math.abs(f.delta)} ${f.units}`; tag = h('span', { class: 'tag change' }, 'from what you run'); }
  else if (f.id === 'tire_spec' && !f.value) { main = 'Your choice'; tag = null; }
  else {
    main = f.display ?? fmt(f.value, f.units);
    if (f.status === 'fixed_by_rule') tag = h('span', { class: 'tag rule' }, 'set by rules');
    else if (isChanged(f)) tag = h('span', { class: 'tag change' }, typeof f.delta === 'number' ? `${f.delta > 0 ? '+' : '−'}${Math.abs(+f.delta.toFixed(2))} ${f.units === '#' ? 'size' : f.units}` : 'changed');
    else if (f.status === 'not_adjustable') tag = null;
    else tag = h('span', { class: 'tag' }, 'no change');
  }
  const urgent = f.steps.some(s => s.urgent);
  const changed = isChanged(f) || urgent;
  const srcs = resolveSources(kb, f.steps.flatMap(s => s.sources));
  return h('details', { class: `row ${changed ? 'changed' : ''} ${f.status === 'blocked' ? 'blocked' : ''}`, 'data-field': f.id },
    h('summary', {},
      h('span', { class: 'item' }, f.label),
      h('span', { class: 'val' }, h('span', { class: 'value' }, main), urgent ? h('span', { class: 'tag urgent' }, 'urgent') : tag,
        isChanged(f) && f.baseline != null && f.status !== 'relative' ? h('span', { class: 'was' }, `was ${fmt(f.baseline, f.units)}`) : null),
      h('span', { class: 'why' }, shortReason(f.reason))),
    h('div', { class: 'row-body' },
      h('p', {}, f.reason),
      f.notes.length ? h('p', { class: 'hint' }, f.notes.join(' ')) : null,
      h('div', {}, h('span', { class: 'label' }, 'How it was worked out '), h('span', { class: 'conf' }, conf(f.confidence))),
      h('ol', {}, f.steps.map(s => h('li', {}, h('b', {}, `${s.stage}: `), s.text, ' ', h('span', { class: 'conf' }, conf(s.confidence))))),
      h('span', { class: 'label' }, 'Sources'),
      h('ul', { class: 'src' }, srcs.map(s => h('li', {}, link(s), ' ', h('span', { class: 'conf' }, conf(s.confidence)))))));
}

async function saveToLog() {
  if (!lastResult) return;
  const r = lastResult, ran = {};
  for (const f of LOGGED_FIELDS) { const v = r.fields[f]?.value; ran[f] = v ?? r.fields[f]?.baseline ?? null; }
  await db.saveSession({
    date: inputs.datetime || nowLocal(), track: inputs.track, configuration: r.track.configuration, ruleSet: inputs.ruleSet,
    surface: inputs.surface, rubber: inputs.rubber, trackTempF: r.derived.trackTempF, airTempF: inputs.weather.airTempF,
    densityAltitudeFt: r.derived.air?.densityAltitudeFt ?? null, driverWeightLb: inputs.driver.weightLb,
    recommended: Object.fromEntries(r.order.map(id => [id, r.fields[id].display ?? r.fields[id].value])),
    ran, laps: [], bestLap: null, engineGood: false, feel: inputs.feel.text, notes: '',
  });
  toast('Saved. Add lap times on the Session log page.');
}

async function fetchWeather(track, when) {
  const lat = track.location?.lat?.value, lon = track.location?.lon?.value;
  if (lat == null || lon == null) throw new Error('track has no coordinates');
  const date = when.slice(0, 10), hour = when.slice(0, 13);
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&hourly=temperature_2m,relative_humidity_2m,surface_pressure,precipitation&temperature_unit=fahrenheit&timezone=auto&start_date=${date}&end_date=${date}`;
  const res = await fetch(url);
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  const j = await res.json();
  const i = Math.max(0, j.hourly.time.findIndex(t => t.startsWith(hour)));
  return {
    time: j.hourly.time[i].replace('T', ' '),
    airTempF: Math.round(j.hourly.temperature_2m[i]),
    rhPct: Math.round(j.hourly.relative_humidity_2m[i]),
    pressureInHg: +(j.hourly.surface_pressure[i] / 33.8639).toFixed(2),
    precipMm: j.hourly.precipitation[i],
  };
}

function trackMap(cfg) {
  const pts = cfg?.outline_m;
  if (!pts?.length) return null;
  const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
  const pad = 14, minX = Math.min(...xs) - pad, maxX = Math.max(...xs) + pad, minY = Math.min(...ys) - pad, maxY = Math.max(...ys) + pad;
  const X = x => (x - minX).toFixed(1), Y = y => (maxY - y).toFixed(1);   // north up
  const d = `M${pts.map(p => `${X(p[0])},${Y(p[1])}`).join('L')}Z`;
  const ns = 'http://www.w3.org/2000/svg';
  const el = (tag, attrs, text) => { const e = document.createElementNS(ns, tag); for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v); if (text != null) e.textContent = text; return e; };
  const svg = el('svg', { viewBox: `0 0 ${(maxX - minX).toFixed(0)} ${(maxY - minY).toFixed(0)}`, class: 'map', role: 'img', 'aria-label': 'Track map with numbered corners' });
  svg.append(el('path', { d, fill: 'none', stroke: 'var(--line-strong)', 'stroke-width': 8, 'stroke-linejoin': 'round' }));
  svg.append(el('path', { d, fill: 'none', stroke: 'var(--surface)', 'stroke-width': 0.6, 'stroke-dasharray': '2 2' }));
  const [a, b] = [pts[0], pts[1]], ang = Math.atan2(b[1] - a[1], b[0] - a[0]);
  const nx = -Math.sin(ang) * 5, ny = Math.cos(ang) * 5;
  svg.append(el('line', { x1: X(a[0] + nx), y1: Y(a[1] + ny), x2: X(a[0] - nx), y2: Y(a[1] - ny), stroke: 'var(--ink)', 'stroke-width': 1.6 }));
  svg.append(el('text', { x: +X(a[0]) + 7, y: +Y(a[1]) + 2, 'font-size': 5, fill: 'var(--ink)', 'font-family': 'var(--font-body)', 'font-weight': 700 }, 'S/F'));
  for (const c of cfg.corners || []) {
    if (!c.apexXY) continue;
    svg.append(el('circle', { cx: X(c.apexXY[0]), cy: Y(c.apexXY[1]), r: 4.2, fill: c.type === 'hairpin' || c.type === 'tight' ? 'var(--accent)' : 'var(--ink)' }));
    svg.append(el('text', { x: X(c.apexXY[0]), y: +Y(c.apexXY[1]) + 1.8, 'font-size': 5, 'text-anchor': 'middle', fill: 'var(--surface)', 'font-weight': 700, 'font-family': 'var(--font-body)' }, String(c.number)));
  }
  return svg;
}

function renderTracks() {
  const root = $('#page-tracks');
  const v = x => (x?.value ?? null);
  const panels = Object.values(kb.tracks).map(t => {
    const cfg = t.configurations?.[0];
    const len = v(cfg?.length_ft) ?? (cfg?.length_ft?.conflict ? cfg.length_ft.conflict.map(c => `${c.value} ft`).join(' / ') + ' (sources disagree)' : null);
    const limits = (t.limits || []).filter(l => l.op !== 'note').map(l => `${l.field.replace(/_/g, ' ')}: ${Array.isArray(l.value) ? l.value.join(' / ') : l.value}`);
    const notes = (t.limits || []).filter(l => l.op === 'note').map(l => `${l.field.replace(/_/g, ' ')}: ${l.value}`);
    const map = trackMap(cfg);
    const corners = cfg?.corners || [];
    return h('section', { class: 'panel stack', id: `track-${t.id}` },
      h('div', { class: 'page-head', style: 'margin:0' }, h('span', { class: 'eyebrow' }, t.club_name || v(t.local_rules?.club) || ''), h('h2', {}, t.name)),
      h('div', { class: 'track-layout' },
        h('div', { class: 'stack' },
          h('dl', { class: 'facts' },
            h('dt', {}, 'Address'), h('dd', {}, v(t.location?.address) || '—'),
            h('dt', {}, 'Length'), h('dd', {}, typeof len === 'number' ? `${len.toLocaleString()} ft` : len || '—'),
            h('dt', {}, 'Surface'), h('dd', {}, v(t.surface) || '—'),
            h('dt', {}, 'Elevation'), h('dd', {}, v(t.location?.elevation_ft) != null ? `≈${v(t.location.elevation_ft).toLocaleString()} ft (estimate)` : '—'),
            h('dt', {}, 'Kid kart rules'), h('dd', {}, t.rules_name || '—')),
          limits.length ? h('div', {}, h('h3', {}, 'Enforced limits'), h('ul', { style: 'margin:6px 0 0;padding-left:1.2rem' }, limits.map(x => h('li', {}, x)))) : null,
          notes.length ? h('div', {}, h('h3', {}, 'Rule notes'), h('ul', { style: 'margin:6px 0 0;padding-left:1.2rem' }, notes.map(x => h('li', {}, x)))) : null),
        h('div', { class: 'stack' },
          map || h('div', { class: 'empty' }, h('h3', {}, 'No corner map yet'), h('p', {}, t.geometry_status)),
          map ? h('p', { class: 'hint' }, `${t.geometry_status} Blue = hairpins and tight corners.`) : null)),
      corners.length ? h('div', { class: 'table-wrap' }, h('table', {},
        h('thead', {}, h('tr', {}, ['#', 'Type', 'Direction', 'Turn', 'Radius', 'Straight before'].map(x => h('th', {}, x)))),
        h('tbody', {}, corners.map(c => h('tr', {}, h('td', {}, c.number), h('td', {}, c.type.replace('_', ' ')), h('td', {}, c.direction), h('td', {}, `${c.turnAngleDeg}°`),
          h('td', {}, `${Math.round(mToFt(c.minRadiusM))} ft`), h('td', {}, `${Math.round(mToFt(c.precedingStraightM))} ft`)))))) : null,
      h('details', {}, h('summary', { style: 'cursor:pointer;font-weight:700' }, `Confirm trackside (${(t.inferred_items || []).length})`),
        h('ul', { style: 'margin:8px 0 0;padding-left:1.2rem;display:grid;gap:4px' }, (t.inferred_items || []).map(i => h('li', {}, i)))));
  });
  root.replaceChildren(
    h('div', { class: 'page-head' }, h('span', { class: 'eyebrow' }, 'Layouts and local rules'), h('h1', {}, 'Tracks'),
      h('div', { class: 'btn-row' }, Object.values(kb.tracks).map(t => h('a', { class: 'btn ghost', href: '#tracks', onclick: e => { e.preventDefault(); $(`#track-${t.id}`).scrollIntoView({ behavior: 'smooth' }); } }, t.short_name || t.name)))),
    h('div', { class: 'stack' }, panels));
}

// ---------------- about page ----------------
function renderAbout() {
  const root = $('#page-about');
  const all = Object.values(kb.sourceIndex);
  const q = h('input', { id: 'srcq', type: 'search', placeholder: 'Search sources, e.g. WKA, jet, OVRP' });
  const tbody = h('tbody');
  const draw = () => tbody.replaceChildren(...all.filter(s => !q.value || JSON.stringify(s).toLowerCase().includes(q.value.toLowerCase())).slice(0, 120)
    .map(s => h('tr', {}, h('td', {}, link(s), s.notes ? h('div', { class: 'hint' }, s.notes) : null), h('td', {}, h('span', { class: 'conf' }, conf(s.confidence))))));
  q.addEventListener('input', draw); draw();
  const steps = [
    ['Your kart', 'Starts from the numbers in My kart. Blanks are never guessed; the sheet says "Need info" instead.'],
    ['Track', 'Corner mix and longest straight adjust gearing, unless the rules fix the gear (OVRP: spec 89).'],
    ['Conditions', 'Surface, rubber, tire age and track temperature combine into one grip estimate, so they never stack three changes.'],
    ['Air', 'Density altitude from temperature, humidity and pressure scales the jet from a session that ran clean, rounded toward rich.'],
    ['Driver', 'Ballast to the minimum weight. A new driver never gets a change that takes rear grip away, except to cure hop.'],
    ['Feedback', 'What the kart did last session: at most two handling changes and one carb change at a time.'],
    ['Rules', 'Every value is checked against the selected rules. Anything illegal is blocked, not suggested.'],
  ];
  root.replaceChildren(
    h('div', { class: 'page-head' }, h('span', { class: 'eyebrow' }, `Knowledge base built ${kb.generated}`), h('h1', {}, 'How it works'),
      h('p', {}, 'A transparent, rules-based advisor. Every line on the setup sheet shows each rule that touched it and the source behind it.')),
    h('div', { class: 'stack' },
      h('section', { class: 'panel' }, h('ol', { style: 'margin:0;padding-left:1.3rem;display:grid;gap:10px' }, steps.map(([t, d]) => h('li', {}, h('b', {}, `${t}. `), d)))),
      h('section', { class: 'panel stack' }, h('h2', {}, 'How much to trust it'),
        h('p', {}, 'Each fact carries a confidence label: manufacturer, sanctioning body, track official, expert consensus, anecdote, inferred or unknown. Most facts came from web search summaries, so labels were capped one level lower unless several sources agreed. No factory baseline was found for this chassis, so the sheet is only as good as the numbers in My kart.')),
      h('section', { class: 'panel stack' }, h('h2', {}, `Sources (${all.length})`), q,
        h('div', { class: 'table-wrap' }, h('table', {}, h('thead', {}, h('tr', {}, h('th', {}, 'Source'), h('th', {}, 'Confidence'))), tbody)))));
}
