jetting:
  method: reference_plus_rule
  reference:
    jet: null
    density_altitude_ft: null
    notes: "No published reference point. The user records jet + DA + plug read from a good session. Until then, output only changes relative to the current jet."
  rule: "Hold AFR constant: A_jet ∝ sqrt(rho_air), so d_jet ∝ rho^0.25. Target area = A_ref * sqrt(rho/rho_ref). Map area to a jet number using measured diameters (about 2% area per number); snap to the nearest available size; round toward the larger (richer) jet; clamp to the legal max of the active rule layers."
  derivation: "m_f = Cd*A_j*sqrt(2*rho_f*dp); dp ≈ m_a^2/(2*rho_a*A_v^2), so sqrt(dp) ∝ m_a/sqrt(rho_a); AFR = m_a/m_f ∝ sqrt(rho_a)/A_j; constant AFR gives A_j ∝ sqrt(rho_a). Standard atmosphere: about -2.9% density per 1000 ft. Gives about 0.4-0.7 jet numbers per 1000 ft DA and about 0.3-0.5 numbers per 10 °F."
  alternative_rule:
    value: "Longacre: change jet area by the same % as air density (A ∝ rho), about twice the sqrt rule (about 0.9-1.4 numbers per 1000 ft)."
    sources: [longacre, kartpulse_density]
    confidence: anecdote
    notes: "Recorded as a conflict, not averaged. sqrt rule is the default because it changes the jet less (safer when air thins)."
  table:
    - {density_altitude_ft: -1000, rel_density: 1.030, jet_if_58_at_0ft: 58.4}
    - {density_altitude_ft: 0, rel_density: 1.000, jet_if_58_at_0ft: 58.0}
    - {density_altitude_ft: 1000, rel_density: 0.971, jet_if_58_at_0ft: 57.6}
    - {density_altitude_ft: 2000, rel_density: 0.943, jet_if_58_at_0ft: 57.2}
    - {density_altitude_ft: 3000, rel_density: 0.915, jet_if_58_at_0ft: 56.7}
  table_notes: "Illustration only (sqrt rule, nominal diameters, hypothetical reference of 58 at 0 ft). Not a published table."
  direction: {value: "lower density (heat, altitude, low pressure, humidity) richens the mixture, so use a smaller jet; cold dense air leans it, so use a larger jet", sources: [ducati_dellorto, longacre], confidence: expert_consensus}
  sources: [engtips, ducati_dellorto, longacre, kartpulse_density, kartpulse_comer_jetting]
  confidence: inferred

symptoms:
  - tag: rich_bog
    signs: "Sluggish, lugging off corners, sputter, smoke, wet black plug, oil spitting from the exhaust"
    fix: "First rule out choke, dirty filter and fouled plug; then one jet size smaller"
    sources: [kartpulse_leanrich, motocrosshideout, kartpulse_plug]
    confidence: expert_consensus
  - tag: rich_top_end
    signs: "Four-stroking (uneven blubbering) at full throttle or top speed; flat top end"
    fix: "One jet size smaller, checked with a plug chop"
    sources: [wiki_4stroking, motocrosshideout]
    confidence: expert_consensus
  - tag: lean_ping
    signs: "Over-revs or 'screams' then goes flat, sharp popping or pinging, overheating, white or grey chalky plug; seizure risk"
    fix: "Go one jet size LARGER right away; check intake air leaks, float and needle valve, fuel line and filter. Never lean out to chase speed."
    sources: [motocrosshideout, wiki_4stroking, kartpulse_leanrich]
    confidence: expert_consensus
  - tag: lean_bog
    signs: "Hesitates or nearly dies when the throttle is snapped open, then surges"
    fix: "Richer jet; check fuel delivery"
    sources: [motocrosshideout]
    confidence: anecdote
  - tag: no_idle
    signs: "Needs choke to idle; dies when the throttle closes"
    fix: "Clean the idle hole and spray tube; check the float and needle valve and for intake leaks. Not a jet change."
    sources: [ntk_7786, myrons_service]
    confidence: anecdote
  - tag: plug_read
    signs: "Light to dark tan or chocolate is good; white or grey is lean (or plug too hot); black and wet is rich. Read after a full-throttle plug chop; castor two-stroke plugs are hard to read; EGT is preferred."
    fix: "Use as a sanity check for main jet changes"
    sources: [kartpulse_plug, kartpulse_leanrich]
    confidence: expert_consensus
