<title>Kid Kart Coaching Course</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&display=swap">
<style>
  /* Layout: course map → lesson → one step at a time. Corner diagrams drawn from real track geometry. */
  :root {
    --bg: #f2f3f0; --surface: #ffffff; --ink: #1a1d1b; --muted: #5b625d; --line: #d7dbd6;
    --accent: #d2361b; --accent-ink: #ffffff; --chip: #e9ece7;
    --say-bg: #fff4e5; --say-ink: #5c3400; --watch-bg: #e8f1fb; --watch-ink: #163a63;
    --ok-bg: #e3f2e7; --ok-ink: #1d5a2e; --warn-bg: #fdecea; --warn-ink: #7c1d12;
    --grass: #dfe9d6; --tarmac: #5d6360; --edge: #f7f7f2; --kerb: #d2361b;
    --good: #ffcf33; --bad: #4fc3f7; --cone: #ff8a00; --eye: #ffffff; --label: #1a1d1b;
    --display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
    --body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #111312; --surface: #1b1e1c; --ink: #e8ebe8; --muted: #a0a7a2; --line: #2f3330;
      --accent: #ff6a4d; --accent-ink: #1a0b07; --chip: #252926;
      --say-bg: #33240f; --say-ink: #ffd9a3; --watch-bg: #142436; --watch-ink: #b9d6f7;
      --ok-bg: #16301f; --ok-ink: #9fe0b2; --warn-bg: #3a1a15; --warn-ink: #ffb3a6;
      --grass: #1f2b1d; --tarmac: #3d4240; --edge: #c9ccc6; --kerb: #e0533a;
      --good: #ffd84d; --bad: #6fd0fa; --cone: #ff9d2e; --eye: #ffffff; --label: #e8ebe8;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #111312; --surface: #1b1e1c; --ink: #e8ebe8; --muted: #a0a7a2; --line: #2f3330;
    --accent: #ff6a4d; --accent-ink: #1a0b07; --chip: #252926;
    --say-bg: #33240f; --say-ink: #ffd9a3; --watch-bg: #142436; --watch-ink: #b9d6f7;
    --ok-bg: #16301f; --ok-ink: #9fe0b2; --warn-bg: #3a1a15; --warn-ink: #ffb3a6;
    --grass: #1f2b1d; --tarmac: #3d4240; --edge: #c9ccc6; --kerb: #e0533a;
    --good: #ffd84d; --bad: #6fd0fa; --cone: #ff9d2e; --eye: #ffffff; --label: #e8ebe8;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--ink); font: 17px/1.5 var(--body);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 12px 40px;
  }
  main { max-width: 760px; margin: 0 auto; display: grid; gap: 16px; }
  h1, h2, h3 { font-family: var(--display); letter-spacing: .02em; text-wrap: balance; margin: 0; line-height: 1.1; }
  h1 { font-size: 2.2rem; text-transform: uppercase; }
  h1 span, .eyebrow { color: var(--accent); }
  h2 { font-size: 1.6rem; }
  h3 { font-size: 1.2rem; text-transform: uppercase; }
  p { margin: 0; }
  .eyebrow { font: 700 .85rem var(--body); letter-spacing: .08em; text-transform: uppercase; }
  .muted { color: var(--muted); }
  .small { font-size: .9rem; }
  button, a.btn {
    font: 600 1rem var(--body); border: 1px solid var(--line); background: var(--chip); color: var(--ink);
    border-radius: 10px; padding: 10px 16px; min-height: 48px; cursor: pointer; text-decoration: none;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  }
  button:focus-visible, a:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .primary, a.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  button.link { background: none; border: none; color: var(--accent); padding: 4px 0; min-height: 36px; }
  button[disabled] { opacity: .45; cursor: default; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: grid; gap: 12px; min-width: 0; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .grow { flex: 1 1 auto; }

  .phase { display: grid; gap: 10px; }
  .week { border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: grid; gap: 8px; background: var(--surface); }
  .week-head { display: flex; gap: 12px; align-items: center; }
  .week-head svg { width: 92px; flex: 0 0 auto; border-radius: 8px; }
  .week-title { font: 700 1.15rem var(--display); text-transform: uppercase; letter-spacing: .03em; }
  .lessons { display: grid; gap: 6px; }
  .lesson-btn { justify-content: space-between; text-align: left; width: 100%; background: var(--bg); }
  .lesson-btn .lt { display: grid; }
  .lesson-btn .lt small { color: var(--muted); font-weight: 500; }
  .tag { font: 700 .72rem var(--body); letter-spacing: .06em; text-transform: uppercase; padding: 3px 8px; border-radius: 999px; background: var(--chip); color: var(--muted); white-space: nowrap; }
  .tag.done { background: var(--ok-bg); color: var(--ok-ink); }
  .tag.part { background: var(--say-bg); color: var(--say-ink); }

  .progress { height: 8px; background: var(--chip); border-radius: 999px; overflow: hidden; }
  .progress > div { height: 100%; background: var(--accent); }
  .steps-nav { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; }
  .steps-nav button { min-height: 36px; min-width: 36px; padding: 4px 10px; font-size: .9rem; flex: 0 0 auto; }
  .steps-nav button[aria-current="step"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .steps-nav button.done:not([aria-current="step"]) { background: var(--ok-bg); color: var(--ok-ink); }
  .block { border-radius: 10px; padding: 12px 14px; display: grid; gap: 6px; }
  .block .lbl { font: 700 .78rem var(--body); letter-spacing: .08em; text-transform: uppercase; }
  .say { background: var(--say-bg); color: var(--say-ink); }
  .say q { font-size: 1.15rem; font-weight: 600; quotes: "“" "”"; }
  .watch { background: var(--watch-bg); color: var(--watch-ink); }
  .ifthen { background: var(--warn-bg); color: var(--warn-ink); }
  .good { background: var(--ok-bg); color: var(--ok-ink); }
  ul.clean, ol.clean { margin: 0; padding-left: 1.3em; display: grid; gap: 4px; }
  .checks { display: grid; gap: 4px; }
  .checks label { display: flex; gap: 10px; align-items: flex-start; padding: 6px 0; cursor: pointer; }
  .checks input { width: 22px; height: 22px; flex: 0 0 auto; margin-top: 2px; accent-color: var(--accent); }
  .cue-chip { display: inline-flex; gap: 6px; align-items: center; border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; font-size: .92rem; background: var(--bg); }
  .stepfoot { display: grid; grid-template-columns: auto 1fr; gap: 8px; }
  .stepfoot .primary { min-height: 56px; font-size: 1.1rem; }
  .gate { display: grid; gap: 8px; }
  .gate-out { border-radius: 10px; padding: 12px 14px; font-weight: 600; }

  figure.dia { margin: 0; display: grid; gap: 8px; }
  figure.dia svg { width: 100%; height: auto; display: block; border-radius: 10px; background: var(--grass); }
  figure.dia figcaption { font-size: .95rem; color: var(--muted); }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: .85rem; color: var(--muted); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .sw { width: 22px; height: 0; border-top: 4px solid var(--good); display: inline-block; }
  .sw.bad { border-top: 3px dashed var(--bad); }
  .dot { width: 14px; height: 14px; border-radius: 50%; display: inline-block; border: 2px solid var(--edge); }
  .two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }

  #kid { position: fixed; inset: 0; z-index: 50; background: var(--surface); display: grid; place-items: center; text-align: center; overflow-y: auto;
    padding: max(20px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(20px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
  #kid[hidden] { display: none; }
  #kid .inner { width: min(100%, 720px); display: grid; gap: 14px; justify-items: center; }
  #kid .big { font-size: min(22vw, 7rem); line-height: 1.1; }
  #kid .phrase { font: 700 clamp(1.6rem, 7vw, 3rem)/1.15 var(--display); text-transform: uppercase; max-width: 18ch; text-wrap: balance; }
  #kid .faces { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; font-size: min(15vw, 4.5rem); }
  #kid figure { width: 100%; }
  @media (max-width: 560px) { h1 { font-size: 1.9rem; } body { font-size: 16px; } .two { grid-template-columns: 1fr; } .week-head svg { width: 72px; } }
</style>

<main id="app"></main>
<div id="kid" hidden role="dialog" aria-modal="true" aria-label="Show your child"></div>

<script>
(function () {
  "use strict";
  var REDUCED = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var NS = "http://www.w3.org/2000/svg";

  /* =====================================================================
     Corner geometry. A corner is a list of segments: straights ["S", len]
     and arcs ["A", degrees (+ left / − right), radius]. Lines are lateral
     offset profiles: [[s, d], …], d = +left / −right of the centre line.
     ===================================================================== */
  var W = 60, M = 24; // track width, usable half-width for the kart line
  function build(segs) {
    var x = 0, y = 0, h = 0, s = 0, pts = [{ x: x, y: y, h: h, s: 0, arc: 0 }];
    segs.forEach(function (sg) {
      var len = sg[0] === "S" ? sg[1] : Math.abs(sg[1]) * Math.PI / 180 * sg[2];
      var dir = sg[0] === "A" ? (sg[1] > 0 ? 1 : -1) : 0;
      for (var i = 0; i < Math.ceil(len); i++) {
        var ds = Math.min(1, len - i);
        if (dir) h += dir * ds / sg[2];
        x += Math.cos(h) * ds; y -= Math.sin(h) * ds; s += ds;
        pts.push({ x: x, y: y, h: h, s: s, arc: dir });
      }
    });
    return pts;
  }
  function at(T, s, d) {
    var i = Math.max(0, Math.min(T.length - 1, Math.round(s))), p = T[i];
    return [p.x - Math.sin(p.h) * d, p.y - Math.cos(p.h) * d];
  }
  function prof(kf) {
    return function (s) {
      if (s <= kf[0][0]) return kf[0][1];
      for (var i = 1; i < kf.length; i++) if (s <= kf[i][0]) {
        var t = (s - kf[i - 1][0]) / (kf[i][0] - kf[i - 1][0]);
        return kf[i - 1][1] + (kf[i][1] - kf[i - 1][1]) * (1 - Math.cos(Math.PI * t)) / 2;
      }
      return kf[kf.length - 1][1];
    };
  }
  function pathD(pts) { return pts.map(function (p, i) { return (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1); }).join(""); }
  function el(tag, a, kids) {
    var e = document.createElementNS(NS, tag);
    Object.keys(a || {}).forEach(function (k) { e.setAttribute(k, a[k]); });
    (kids || []).forEach(function (c) { e.appendChild(c); });
    return e;
  }
  var uid = 0;

  /* Draw one corner diagram. spec: {segs, lines:[{kf, kind, label, at}], marks:[{s,d,t,label,side}], eyes:[{from:[s,d], to:[s,d], label}], kart:true} */
  function draw(spec, opts) {
    opts = opts || {};
    var T = build(spec.segs), L = T[T.length - 1].s, id = "d" + (++uid);
    var minX = 1e9, minY = 1e9, maxX = -1e9, maxY = -1e9;
    T.forEach(function (p) { [-W / 2, W / 2].forEach(function (d) { var q = at(T, p.s, d); minX = Math.min(minX, q[0]); maxX = Math.max(maxX, q[0]); minY = Math.min(minY, q[1]); maxY = Math.max(maxY, q[1]); }); });
    var pad = opts.mini ? 6 : 34;
    var svg = el("svg", { viewBox: (minX - pad) + " " + (minY - pad) + " " + (maxX - minX + 2 * pad) + " " + (maxY - minY + 2 * pad), role: "img", "aria-label": spec.alt || spec.caption || "Corner diagram" });
    var defs = el("defs");
    defs.appendChild(el("marker", { id: id + "ar", viewBox: "0 0 10 10", refX: "8", refY: "5", markerWidth: "6", markerHeight: "6", orient: "auto-start-reverse" }, [el("path", { d: "M0 0L10 5L0 10z", fill: "var(--eye)" })]));
    defs.appendChild(el("marker", { id: id + "dir", viewBox: "0 0 10 10", refX: "5", refY: "5", markerWidth: "5", markerHeight: "5", orient: "auto" }, [el("path", { d: "M0 0L10 5L0 10z", fill: "var(--edge)" })]));
    svg.appendChild(defs);
    var all = []; for (var s = 0; s <= L; s += 2) all.push(s);
    var left = all.map(function (s) { return at(T, s, W / 2); }), right = all.map(function (s) { return at(T, s, -W / 2); });
    svg.appendChild(el("path", { d: pathD(left.concat(right.slice().reverse())) + "Z", fill: "var(--tarmac)" }));
    svg.appendChild(el("path", { d: pathD(left), fill: "none", stroke: "var(--edge)", "stroke-width": "2" }));
    svg.appendChild(el("path", { d: pathD(right), fill: "none", stroke: "var(--edge)", "stroke-width": "2" }));
    // kerbs on the inside of each arc
    var run = null;
    function flushKerb() {
      if (run && run.pts.length > 3) {
        var d = pathD(run.pts);
        svg.appendChild(el("path", { d: d, fill: "none", stroke: "var(--edge)", "stroke-width": "6" }));
        svg.appendChild(el("path", { d: d, fill: "none", stroke: "var(--kerb)", "stroke-width": "6", "stroke-dasharray": "6 6" }));
      }
      run = null;
    }
    T.forEach(function (p, i) {
      if (i % 2) return;
      if (p.arc) { if (!run || run.dir !== p.arc) { flushKerb(); run = { dir: p.arc, pts: [] }; } run.pts.push(at(T, p.s, p.arc * (W / 2 - 3))); }
      else flushKerb();
    });
    flushKerb();
    if (!opts.mini) {
      var a0 = at(T, 6, 0), a1 = at(T, 24, 0);
      svg.appendChild(el("line", { x1: a0[0], y1: a0[1], x2: a1[0], y2: a1[1], stroke: "var(--edge)", "stroke-width": "2", "marker-end": "url(#" + id + "dir)", opacity: ".7" }));
    }
    var goodPath = null;
    (spec.lines || []).forEach(function (ln, k) {
      var f = prof(ln.kf), pts = []; for (var s = 0; s <= L; s += 2) pts.push(at(T, s, f(s)));
      var attrs = { d: pathD(pts), fill: "none", "stroke-linecap": "round", "stroke-linejoin": "round" };
      if (ln.kind === "bad") { attrs.stroke = "var(--bad)"; attrs["stroke-width"] = opts.mini ? "3" : "3"; attrs["stroke-dasharray"] = "7 6"; }
      else if (ln.kind === "thin") { attrs.stroke = "var(--good)"; attrs["stroke-width"] = "1.6"; attrs.opacity = ".85"; }
      else { attrs.stroke = "var(--good)"; attrs["stroke-width"] = opts.mini ? "5" : "4"; attrs.id = id + "g" + k; if (!goodPath) goodPath = attrs.id; }
      svg.appendChild(el("path", attrs));
    });
    if (!opts.mini) {
      (spec.eyes || []).forEach(function (e) {
        var a = at(T, e.from[0], e.from[1]), b = at(T, e.to[0], e.to[1]);
        svg.appendChild(el("line", { x1: a[0], y1: a[1], x2: b[0], y2: b[1], stroke: "var(--eye)", "stroke-width": "2", "stroke-dasharray": "3 4", "marker-end": "url(#" + id + "ar)" }));
        svg.appendChild(el("text", { x: a[0], y: a[1] - 9, "text-anchor": "middle", "font-size": "17" }, [document.createTextNode("👀")]));
      });
      (spec.marks || []).forEach(function (m) {
        var c = at(T, m.s, m.d), g;
        if (m.t === "cone") g = el("path", { d: "M" + c[0] + " " + (c[1] - 9) + "l7 14h-14z", fill: "var(--cone)", stroke: "var(--edge)", "stroke-width": "1.5" });
        else if (m.t === "kart") g = el("rect", { x: c[0] - 7, y: c[1] - 5, width: 14, height: 10, rx: 3, fill: m.color || "var(--good)", stroke: "var(--tarmac)", "stroke-width": "2" });
        else {
          g = el("g", {}, [el("circle", { cx: c[0], cy: c[1], r: 10, fill: m.color || "var(--surface)", stroke: "var(--tarmac)", "stroke-width": "2" }),
            el("text", { x: c[0], y: c[1] + 4.5, "text-anchor": "middle", "font-size": "12", "font-weight": "700", fill: m.color ? "#1a1d1b" : "var(--label)", "font-family": "var(--body)" }, [document.createTextNode(m.t)])]);
        }
        svg.appendChild(g);
        if (m.label) {
          var side = m.side || (m.d >= 0 ? 1 : -1), off = (W / 2 - Math.abs(m.d)) + 18;
          var lp = m.lp ? at(T, m.lp[0], m.lp[1]) : at(T, m.s, m.d + side * off);
          svg.appendChild(el("text", { x: lp[0], y: lp[1] + 4, "text-anchor": "middle", "font-size": "13", "font-weight": "700", fill: "var(--label)", "font-family": "var(--body)", "paint-order": "stroke", stroke: "var(--grass)", "stroke-width": "4" }, [document.createTextNode(m.label)]));
        }
      });
    }
    if (goodPath && !REDUCED && spec.kart !== false) {
      var kart = el("g", {}, [el("rect", { x: -8, y: -5.5, width: 16, height: 11, rx: 3, fill: "var(--accent)", stroke: "var(--edge)", "stroke-width": "1.5" })]);
      var mo = el("animateMotion", { dur: (L / 95).toFixed(1) + "s", repeatCount: "indefinite", rotate: "auto" }, [el("mpath", { href: "#" + goodPath })]);
      kart.appendChild(mo); svg.appendChild(kart);
    }
    return svg;
  }

  /* ---------- Corner library ---------- */
  var C90 = [["S", 150], ["A", 90, 70], ["S", 150]];                 // 90° left; arc s 150–260
  var HAIR = [["S", 170], ["A", 180, 42], ["S", 170]];               // hairpin left; arc s 170–302
  var SWEEP = [["S", 90], ["A", 70, 170], ["S", 100]];               // sweeper left; arc s 90–298
  var KINK = [["S", 130], ["A", 22, 160], ["S", 130]];               // kink left; arc s 130–191
  var CHIC = [["S", 110], ["A", 70, 60], ["A", -70, 60], ["S", 130]]; // chicane L-R; arcs 110–183, 183–256
  var LINK = [["S", 110], ["A", 90, 55], ["S", 55], ["A", -90, 55], ["S", 230]]; // left, short gap, right onto a long straight

  var OIO = [[0, -M], [125, -M], [205, M], [300, -M], [410, -M]];
  var DIAS = {
    oio: { segs: C90, caption: "Wide, kiss, wide: start on the outside, touch the inside at the apex, roll back out to the outside edge. This is the biggest, roundest arc the corner allows, so the kart keeps the most speed.",
      lines: [{ kf: OIO, label: "racing line", at: 60, lo: 14 }, { kf: [[0, 0], [410, 0]], kind: "bad", label: "middle of the road", at: 330, lo: -14 }],
      marks: [{ s: 125, d: -M, t: "T", label: "turn-in", color: "var(--good)" }, { s: 205, d: M, t: "A", label: "apex", color: "var(--good)" }, { s: 300, d: -M, t: "E", label: "exit", color: "var(--good)" }] },
    treasures: { segs: C90, caption: "The four treasures. Every corner has a slow-down spot (S), a turn-in spot (T), an apex (A) and an exit (E). Find a real thing next to each one: a post, a kerb end, a crack, a sign.",
      lines: [{ kf: OIO }],
      marks: [{ s: 70, d: -M, t: "S", label: "slow / lift", color: "var(--surface)" }, { s: 70, d: -W / 2 - 8, t: "cone" }, { s: 125, d: -W / 2 - 8, t: "cone" }, { s: 125, d: -M, t: "T", label: "turn", color: "var(--good)", side: 1 },
        { s: 205, d: W / 2 + 7, t: "cone" }, { s: 205, d: M, t: "A", label: "kiss", color: "var(--good)", side: -1 }, { s: 300, d: -W / 2 - 8, t: "cone" }, { s: 300, d: -M, t: "E", label: "wide", color: "var(--good)", side: 1 }] },
    late: { segs: C90, caption: "Early apex vs late apex. Turn in too early and the kart is pointed at the outside wall halfway round: it has to slow down or run off. Wait a little longer, apex later, and the kart is already straight at the exit, so it can go flat out sooner.",
      lines: [{ kf: [[0, -M], [140, -M], [222, M], [295, -M], [410, -M]], label: "late kiss", at: 330, lo: 16 }, { kf: [[0, -M], [95, -M], [168, M], [250, -W / 2 - 16], [410, -W / 2 - 16]], kind: "bad", label: "too early: runs off the road" }],
      marks: [{ s: 95, d: -M, t: "T", color: "var(--bad)" }, { s: 140, d: -M, t: "T", label: "wait…", color: "var(--good)", side: -1 }, { s: 222, d: M, t: "A", label: "late apex", color: "var(--good)" }] },
    eyes: { segs: C90, caption: "Eyes lead the line. At the turn-in, the eyes are already on the apex. At the apex, the eyes are already on the exit. Hands follow eyes, kart follows hands.",

  var PHASES = [

  /* ---------- Build lessons ---------- */
  var LESSONS = [];

    LESSONS.push({ id: "w" + d.w + "-sim", w: d.w, ph: d.ph, d: d, part: "sim", day: "Saturday evening", icon: "🖥️", code: d.code + " · sim", title: d.sim.title, steps: simSteps(d) });
    if (d.check) LESSONS.push({ id: "w" + d.w + "-check", w: d.w, ph: d.ph, d: d, part: "check", day: "Sunday", icon: "✅", code: "Phase " + d.ph + " check", title: "Phase " + d.ph + " check", steps: checkSteps(PHASES[d.ph - 1]) });
    else LESSONS.push({ id: "w" + d.w + "-sun", w: d.w, ph: d.ph, d: d, part: "sun", day: "Sunday", icon: "🏎️", code: d.code + " · own it", title: d.title, steps: trackSteps(d, "sun") });
  });
  var BY_ID = {}; LESSONS.forEach(function (l, i) { l.index = i; BY_ID[l.id] = l; });

  function trackSteps(d, part) {
    var day = d[part], s = [];
    if (part === "sat") s.push({ title: "Understand the line", kind: "concept" });
    else s.push({ title: "Recap the line", kind: "recap" });
    s.push({ title: "Choose the corner & set up", kind: "setup", day: day });
    s.push({ title: "Safety & pit routine", kind: "safety" });
    s.push({ title: "Show your child", kind: "teach" });
    day.runs.forEach(function (r, i) { s.push({ title: r[0], kind: "run", run: r, i: i }); });
    s.push({ title: "Run 5 · Your Choice", kind: "choice" });
    s.push({ title: "Lunch & reset", kind: "lunch" });
    s.push({ title: "Afternoon twist", kind: "twist", day: day });
    s.push({ title: "End the day", kind: "end", part: part });
    return s;
  }
  function simSteps(d) {
    return [{ title: "Before you start", kind: "simplan" }, { title: "Show the corner", kind: "simshow" }, { title: "The game", kind: "simgame" }, { title: "Sim goes to sleep", kind: "simend" }];
  }
  function checkSteps(ph) {

  }

  /* ---------- State ---------- */
  var KEY = "kid-kart-lines-v1", state = { done: {}, last: null, funs: [] };
  try { var raw = localStorage.getItem(KEY); if (raw) state = Object.assign(state, JSON.parse(raw)); } catch (e) {}
  function persist() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
  function doneSet(id) { return state.done[id] || (state.done[id] = []); }

  /* ---------- DOM helpers ---------- */
  var app = document.getElementById("app"), kid = document.getElementById("kid");
  function h(tag, a, kids) {

      else if (k.slice(0, 2) === "on") e.addEventListener(k.slice(2), v); else e.setAttribute(k, v);
    });

    return e;
  }
  function p(t, c) { return h("p", { class: c, text: t }); }
  function block(cls, lbl, kids) { return h("div", { class: "block " + cls }, [h("div", { class: "lbl", text: lbl })].concat(kids)); }
  function say(t) { return block("say", "Say", [h("q", { text: t })]); }
  function list(items, ordered) { return h(ordered ? "ol" : "ul", { class: "clean" }, items.map(function (t) { return h("li", { text: t }); })); }
  function cueChip(id) { return h("span", { class: "cue-chip" }, [CUES[id][0] + " " + CUES[id][1]]); }
  function legend(name) {
    var spec = DIAS[name], items = [], seen = {};
    (spec.lines || []).forEach(function (ln) {
      var name = ln.label || (ln.kind === "bad" ? "wrong line" : ln.kind === "thin" ? "one line per lap" : "racing line");
      if (seen[name]) return; seen[name] = 1;
      items.push(h("span", null, [h("i", { class: ln.kind === "bad" ? "sw bad" : "sw" }), name]));
    });
    var LET = { S: "slow down", T: "turn-in", A: "apex (the kiss)", E: "exit" };
    var lets = {}; (spec.marks || []).forEach(function (m) { if (LET[m.t]) lets[m.t] = 1; });
    Object.keys(LET).forEach(function (k) { if (lets[k]) items.push(h("span", null, [h("b", { text: k }), " " + LET[k]])); });
    if ((spec.marks || []).some(function (m) { return m.t === "cone"; })) items.push(h("span", null, ["🔺 cone"]));
    if ((spec.eyes || []).length) items.push(h("span", null, ["👀 → where the eyes look"]));
    items.push(h("span", null, [h("i", { class: "dot", style: "background:var(--kerb)" }), "kerb on the inside"]));
    return h("div", { class: "legend" }, items);
  }
  function figure(name, opts) {

  }
  function showKid(nodes) {

  }
  function hideKid() { kid.hidden = true; }
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !kid.hidden) hideKid(); });
  function showCue(id, dia) {
    return h("button", { type: "button", text: "Show your child", onclick: function () {

    } });
  }
  function showFaces() {
    showKid([h("div", { class: "phrase", text: "How much fun?" }), h("div", { class: "faces" }, ["😞", "🙁", "😐", "🙂", "🤩"].map(function (f) { return h("span", { text: f }); }))]);
  }
  function fixes(list2) { return block("ifthen", "If… then", [list(list2.map(function (f) { return "If " + f[0].charAt(0).toLowerCase() + f[0].slice(1) + " → " + f[1]; }))]); }

  /* ---------- Step bodies ---------- */
  function body(step, l) {
    var d = l.d, o = [];
    switch (step.kind) {
      case "concept":
        o.push(block("good", "This weekend's one focus", [p(d.title + ".")]));
        d.why.forEach(function (t) { o.push(p(t)); });
        if (d.dias.length > 1) o.push(h("div", { class: "two" }, d.dias.map(function (n) { return figure(n); })));
        else o.push(figure(d.dias[0]));
        o.push(h("div", { class: "row" }, d.cues.map(cueChip)));
        o.push(p("Read this the night before. At the track, you'll show your child the moving picture, not the words.", "muted small"));
        break;
      case "recap":
        o.push(p("Same focus as yesterday. Today you take it to new corners, or take the cones away."));
        o.push(figure(d.dias[0]));
        break;
      case "setup":
        o.push(block("good", "Corner", [p(step.day.corner)]));
        o.push(block("good", "Set up", [p(step.day.setup)]));
        if (d.dias[0] && l.part === "sat") o.push(figure(d.dias[0] === "oio" && d.w === 1 ? "treasures" : d.dias[0], { bare: false }));
        o.push(p("Cones: only with the track's permission, soft cones at the very edge, and placed only when no karts are moving. Take them away after 2–3 track days, so your child learns real reference points.", "muted small"));
        break;
      case "safety":
        var ds = doneSet(l.id + ":safety");
        o.push(h("div", { class: "checks" }, SAFETY.map(function (t, i) {
          var id = "s-" + l.id + "-" + i, cb = h("input", { type: "checkbox", id: id });
          cb.checked = ds.indexOf(i) >= 0;
          cb.addEventListener("change", function () { var k = ds.indexOf(i); if (cb.checked && k < 0) ds.push(i); if (!cb.checked && k >= 0) ds.splice(k, 1); persist(); });
          return h("label", { for: id }, [cb, h("span", { text: t })]);
        })));
        o.push(say(CUES.QUIET[1]));
        o.push(p("Before every run: helmet strap snug, hands at 9 and 3, no throttle until the helper says go (the Comer C52's centrifugal clutch moves the kart as soon as the revs rise). On the grid, say only: “Have fun, I'm watching you!”", "muted small"));
        break;
      case "teach":

        o.push(figure(d.dias[0], { bare: true }));
        o.push(say(CUES[d.kid][1]));
        o.push(block("good", "Hand sign", [p(CUES[d.kid][2] + ". Now you can cue from the fence without shouting.")]));
        o.push(showCue(d.kid, d.dias[0]));
        o.push(h("div", { class: "row" }, [p("Today's cues (max 3):", "muted small")].concat(d.cues.map(cueChip))));
        break;
      case "run":

        o.push(h("div", { style: "max-width:420px;width:100%" }, [figure(d.dias[0], { bare: true })]));
        o.push(block("good", "Set up", [p(r[1])]));
        if (r[2]) o.push(h("div", { class: "row" }, [say(CUES[r[2]][1]), showCue(r[2], d.dias[0])]));
        else o.push(block("say", "Say", [p("Nothing new. “Have fun, I'm watching you!”")]));
        o.push(block("watch", "Watch for", [p(r[3])]));
        o.push(block("say", "After the run · they talk first", [list(["Water, visor up.", "“Tell me about that run!”", "“" + r[4] + "”", "Then ONE thing from you, in cue words only, or just praise what you saw."])]));
        if (step.i >= 1 && d[l.part] && d[l.part].fix) o.push(fixes(d[l.part].fix));
        else if (step.i >= 1 && d.sat.fix) o.push(fixes(d.sat.fix));
        break;
      case "choice":
        o.push(p(CHOICE));
        o.push(h("button", { type: "button", text: "Show the choices", onclick: function () { showKid([h("div", { class: "big", text: "🐢 🎯 🔁 🆓" }), h("div", { class: "phrase", text: "Your choice!" })]); } }));
        break;
      case "lunch":

        o.push(funRec(l));
        if (step.part === "sun" && d.gate) o.push(gate(l, d));
        else if (step.part === "sat") o.push(block("watch", "Next", [p("Tonight: " + d.sim.title + " (10–15 min). Tomorrow: " + (d.check ? "Phase " + d.ph + " check." : d.title + ", own it."))]));
        break;
      case "simplan":
        o.push(list(["Time cap: 10–15 minutes on a visible sand timer.", "At least 1 hour before bed. Sit next to them the whole time.", "Torque profile low (Fanatec FF about 1 Nm peak). Fingers outside the spokes. Hands off the wheel = pause.", "Automobilista 2 rental or GX390 kart. Never iRacing (13+ only).", "No leaderboards and no “fastest lap” talk."]));
        break;
      case "simshow":
        o.push(figure(d.dias[0]));
        o.push(showCue(d.kid, d.dias[0]));
        break;
      case "simgame":
        o.push(list(d.sim.game, true));
        o.push(block("good", "Score", [p(d.sim.score)]));
        break;
      case "simend":
        o.push(say("When the sand's gone, the sim goes to sleep."));
        o.push(h("button", { type: "button", onclick: showFaces, text: "Show the faces" }));
        o.push(funRec(l));
        o.push(block("watch", "Tomorrow", [p(d.check ? "Phase " + d.ph + " check day." : "Run 1 tomorrow uses tonight's cue.")]));
        break;
      case "chkplan":
        o.push(p("A lighter day: at most 6 runs. Morning: your child's favourite lessons from this phase. Afternoon: you watch and tick the phase check."));
        break;
      case "chkfav":
        o.push(p("Show the pictures. Your child picks 3–4 runs."));
        var ls = LESSONS_DATA.filter(function (x) { return x.ph === step.ph.n; });
        o.push(h("div", { class: "two" }, ls.map(function (x) {
          return h("button", { type: "button", style: "display:grid;gap:6px;padding:8px", onclick: function () { showKid([figure(x.dias[0], { bare: true }), h("div", { class: "phrase", text: CUES[x.kid][1] })]); } },
            [draw(DIAS[x.dias[0]], { mini: true }), h("span", { text: x.title })]);
        })));
        break;
      case "chk":
        o.push(p("Tick only what you've seen on 2 different track days."));
        var cs = doneSet(l.id + ":exit");
        o.push(h("div", { class: "checks" }, step.ph.exit.map(function (t, i) {
          var id = "x-" + l.id + "-" + i, cb = h("input", { type: "checkbox", id: id });
          cb.checked = cs.indexOf(i) >= 0;
          cb.addEventListener("change", function () { var k = cs.indexOf(i); if (cb.checked && k < 0) cs.push(i); if (!cb.checked && k >= 0) cs.splice(k, 1); persist(); });
          return h("label", { for: id }, [cb, h("span", { text: t })]);
        })));
        break;
      case "chkend":

        if (all && nx) { var first = LESSONS.filter(function (x) { return x.ph === nx.n; })[0]; o.push(h("div", { class: "gate-out good" }, ["All ticked. Phase " + nx.n + " (" + nx.name + ") starts next weekend: ", h("a", { href: "#" + first.id, text: first.d.code + " " + first.title }), "."])); }
        else if (all) o.push(h("div", { class: "gate-out good", text: "Course complete. Ask your child what was most fun. Next: repeat Phase 3 at a new track, try club Kid Kart events if they ask, or take a break and play other sports." }));
        else o.push(h("div", { class: "gate-out say", text: c2.length + " of " + step.ph.exit.length + " ticked. Stay in Phase " + step.ph.n + ": next weekend, repeat the lessons for the unticked lines. That's normal." }));
        break;
    }
    return o;
  }

  function funRec(l) {
    var cur = state.funs.filter(function (f) { return f.id === l.id; }).pop();
    var row = h("div", { class: "row" }, [p("Record the face:", "muted small")]);
    ["😞", "🙁", "😐", "🙂", "🤩"].forEach(function (f, i) {
      row.appendChild(h("button", { type: "button", "aria-pressed": cur && cur.v === i + 1 ? "true" : "false", "aria-label": "Fun " + (i + 1), text: f, class: cur && cur.v === i + 1 ? "primary" : null, style: "font-size:1.5rem;min-width:52px",
        onclick: function () { state.funs = state.funs.filter(function (x) { return x.id !== l.id; }); state.funs.push({ id: l.id, v: i + 1, t: Date.now() }); persist(); render(); } }));
    });
    var v = state.funs.slice().sort(function (a, b) { return a.t - b.t; }).map(function (x) { return x.v; }), n = v.length;
    var warn = (n >= 3 && v[n - 1] < v[n - 2] && v[n - 2] < v[n - 3]) || (n >= 2 && v[n - 1] <= 2 && v[n - 2] <= 2);
    return h("div", { class: "gate" }, [row, warn ? h("div", { class: "gate-out ifthen", text: "Fun has dropped two sessions in a row. Next session: free runs only, no drills, no questions. Then repeat the last lesson your child enjoyed." }) : null]);
  }
  function gate(l, d) {
    var key = l.id + ":gate", val = state.done[key], nxt = LESSONS[l.index + 1];
    var yes = h("button", { type: "button", class: val === "yes" ? "primary" : null, text: "Yes", onclick: function () { state.done[key] = "yes"; persist(); render(); } });
    var no = h("button", { type: "button", class: val === "no" ? "primary" : null, text: "Not yet", onclick: function () { state.done[key] = "no"; persist(); render(); } });
    return h("div", { class: "gate" }, [h("h3", { text: "Weekend check" }), p(d.gate), h("div", { class: "row" }, [yes, no]),
      val === "yes" && nxt ? h("div", { class: "gate-out good" }, ["Move on. Next weekend: ", h("a", { href: "#" + nxt.id, text: nxt.d.code + " " + nxt.title }), "."]) : null,
      val === "no" ? h("div", { class: "gate-out say", text: "Repeat this lesson next weekend at a different corner. Staying longer is normal, and the line is worth getting right." }) : null]);
  }

  /* ---------- Screens ---------- */
  function status(l) { var n = doneSet(l.id).length; return n >= l.steps.length ? ["Done", "done"] : n ? [n + "/" + l.steps.length, "part"] : [l.steps.length + " steps", ""]; }
  function home() {
    var resume = state.last && BY_ID[state.last.id];
    var head = h("header", { class: "card" }, [
      h("p", { class: "eyebrow", text: "Kid Kart · racing lines · 12 weekends" }),
      h("h1", null, ["Kid Kart ", h("span", { text: "Coaching Course" })]),
      p("For a driver who already handles the kart. Every weekend is one racing-line idea, drawn as a corner diagram, then coached step by step: what to set up, what to say, what to show your child, what to watch for, and what to do if it goes wrong.", "muted"),
      figure("oio"),
      h("div", { class: "row" }, [h("a", { class: "btn primary", href: "#" + (resume ? resume.id : "w1-sat"), text: resume ? "Resume: " + resume.code : "Start Weekend 1" })])
    ]);
    var rules = h("section", { class: "card" }, [h("h2", { text: "Rules for every session" }), list(["One focus, max 3 cues. Same words every time.", "Your child talks first after every run.", "Nothing new on the grid.", "A child's choice in every session.", "Fun drops two sessions in a row → free runs only next time.", "Move on when the skill shows up, not when the calendar says."], true)]);
    var map = PHASES.map(function (ph) {
      return h("section", { class: "phase" }, [h("p", { class: "eyebrow", text: "Phase " + ph.n }), h("h2", { text: ph.name }), p(ph.line, "muted"),
        h("div", { class: "phase" }, LESSONS_DATA.filter(function (x) { return x.ph === ph.n; }).map(function (x) {
          return h("div", { class: "week" }, [
            h("div", { class: "week-head" }, [draw(DIAS[x.dias[0]], { mini: true }), h("div", null, [h("div", { class: "week-title", text: "Weekend " + x.w + " · " + x.title }), p(CUES[x.kid][0] + " “" + CUES[x.kid][1] + "”", "muted small")])]),
            h("div", { class: "lessons" }, LESSONS.filter(function (l) { return l.w === x.w; }).map(function (l) {
              var st = status(l);
              return h("a", { class: "btn lesson-btn", href: "#" + l.id }, [h("span", { class: "lt" }, [h("span", { text: l.icon + " " + l.day }), h("small", { text: l.code })]), h("span", { class: "tag " + st[1], text: st[0] })]);
            }))]);
        }))]);
    });
    var reset = h("button", { type: "button", class: "link", text: "Reset progress on this device" });
    reset.addEventListener("click", function () { if (reset.dataset.armed) { state = { done: {}, last: null, funs: [] }; persist(); render(); } else { reset.dataset.armed = "1"; reset.textContent = "Tap again to reset everything"; } });
    var srcs = h("section", { class: "card" }, [h("h3", { text: "Where the ideas come from" }), p("Turning in too early and not using the full track width as common mistakes; small, smooth inputs: David Sera, Kart Class. Look one stage ahead; slow before turning for a later apex: Red Bull, “Karting mistakes novices make”. Cones can cause fixation: Ross Bentley, Speed Secrets. Consistency judged on spread: from your brief, attributed to Alessio Lorandi. Everything marked “coaching synthesis”, including all Kid Kart momentum advice, is coaching judgement, not a sourced fact. Full list: program/10-sources.md.", "muted small")]);
    app.textContent = "";
    [head, rules].concat(map).concat([srcs, h("p", { class: "muted small" }, ["Progress is saved on this device only. ", reset])]).forEach(function (n) { app.appendChild(n); });
  }
  function first(l) { var d = doneSet(l.id); for (var i = 0; i < l.steps.length; i++) if (d.indexOf(i) < 0) return i; return 0; }
  function lesson(l) {
    var si = Math.min(state.last && state.last.id === l.id ? state.last.step : first(l), l.steps.length - 1);
    state.last = { id: l.id, step: si }; persist();
    var st = l.steps[si], ds = doneSet(l.id), last = si === l.steps.length - 1;
    var go = function (i) { state.last = { id: l.id, step: i }; persist(); render(); window.scrollTo(0, 0); };
    app.textContent = "";
    app.appendChild(h("header", { class: "card" }, [
      h("div", { class: "row" }, [h("a", { href: "#home", class: "btn", text: "← Course" }), h("span", { class: "grow" }), h("span", { class: "tag", text: l.day })]),
      h("p", { class: "eyebrow", text: "Weekend " + l.w + " · " + l.code }),
      h("h1", { text: l.title, style: "font-size:2rem" }),
      h("div", { class: "progress", role: "progressbar", "aria-label": "Lesson progress", "aria-valuenow": Math.round(ds.length / l.steps.length * 100), "aria-valuemin": "0", "aria-valuemax": "100" }, [h("div", { style: "width:" + Math.round(ds.length / l.steps.length * 100) + "%" })]),
      h("nav", { class: "steps-nav", "aria-label": "Steps" }, l.steps.map(function (s, i) { return h("button", { type: "button", title: s.title, class: ds.indexOf(i) >= 0 ? "done" : null, "aria-current": i === si ? "step" : null, text: String(i + 1), onclick: function () { go(i); } }); }))
    ]));
    app.appendChild(h("section", { class: "card", "aria-labelledby": "stepTitle" }, [h("p", { class: "eyebrow", text: "Step " + (si + 1) + " of " + l.steps.length }), h("h2", { id: "stepTitle", text: st.title })]
      .concat(body(st, l))
      .concat([h("div", { class: "stepfoot" }, [
        h("button", { type: "button", text: "Back", disabled: si === 0 ? "disabled" : null, onclick: function () { go(si - 1); } }),
        h("button", { type: "button", class: "primary", text: last ? "Finish lesson ✓" : "Done · next step →", onclick: function () { if (ds.indexOf(si) < 0) ds.push(si); if (last) { persist(); location.hash = "#home"; render(); } else go(si + 1); } })
      ])])));
  }
  function render() { var l = BY_ID[(location.hash || "").slice(1)]; if (l) lesson(l); else home(); }
  window.addEventListener("hashchange", function () { var l = BY_ID[(location.hash || "").slice(1)]; if (l && (!state.last || state.last.id !== l.id)) state.last = { id: l.id, step: first(l) }; render(); window.scrollTo(0, 0); });
  render();
})();
</script>
