<title>Kid Kart Coaching Course</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&display=swap">
<style>
  /* Layout: course map (weekends → lessons), then one step at a time with a big Next button, like a pit board. */
  :root {
    --bg: #f2f3f0; --surface: #ffffff; --ink: #1a1d1b; --muted: #5b625d; --line: #d7dbd6;
    --accent: #d2361b; --accent-ink: #ffffff; --chip: #e9ece7;
    --say-bg: #fff4e5; --say-ink: #5c3400; --watch-bg: #e8f1fb; --watch-ink: #163a63;
    --ok-bg: #e3f2e7; --ok-ink: #1d5a2e; --warn-bg: #fdecea; --warn-ink: #7c1d12;
    --display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
    --body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #111312; --surface: #1b1e1c; --ink: #e8ebe8; --muted: #a0a7a2; --line: #2f3330;
      --accent: #ff6a4d; --accent-ink: #1a0b07; --chip: #252926;
      --say-bg: #33240f; --say-ink: #ffd9a3; --watch-bg: #142436; --watch-ink: #b9d6f7;
      --ok-bg: #16301f; --ok-ink: #9fe0b2; --warn-bg: #3a1a15; --warn-ink: #ffb3a6;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #111312; --surface: #1b1e1c; --ink: #e8ebe8; --muted: #a0a7a2; --line: #2f3330;
    --accent: #ff6a4d; --accent-ink: #1a0b07; --chip: #252926;
    --say-bg: #33240f; --say-ink: #ffd9a3; --watch-bg: #142436; --watch-ink: #b9d6f7;
    --ok-bg: #16301f; --ok-ink: #9fe0b2; --warn-bg: #3a1a15; --warn-ink: #ffb3a6;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--ink); font: 17px/1.5 var(--body);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 12px 40px;
  }
  main { max-width: 720px; margin: 0 auto; display: grid; gap: 16px; }
  h1, h2, h3 { font-family: var(--display); letter-spacing: .02em; text-wrap: balance; margin: 0; line-height: 1.1; }
  h1 { font-size: 2.2rem; text-transform: uppercase; }
  h1 span, .eyebrow { color: var(--accent); }
  h2 { font-size: 1.6rem; }
  h3 { font-size: 1.2rem; text-transform: uppercase; }
  p { margin: 0; }
  .eyebrow { font: 700 .85rem var(--body); letter-spacing: .08em; text-transform: uppercase; }
  .muted { color: var(--muted); }
  .small { font-size: .9rem; }
  button, a.btn {
    font: 600 1rem var(--body); border: 1px solid var(--line); background: var(--chip); color: var(--ink);
    border-radius: 10px; padding: 10px 16px; min-height: 48px; cursor: pointer; text-decoration: none;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  }
  button:focus-visible, a:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  button.link { background: none; border: none; color: var(--accent); padding: 4px 0; min-height: 36px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: grid; gap: 12px; min-width: 0; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .grow { flex: 1 1 auto; }

  /* Course map */
  .phase { display: grid; gap: 10px; }
  .phase-head { display: grid; gap: 2px; }
  .week { border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: grid; gap: 8px; background: var(--surface); }
  .week-title { font: 700 1.1rem var(--display); text-transform: uppercase; letter-spacing: .03em; }
  .lessons { display: grid; gap: 6px; }
  .lesson-btn { justify-content: space-between; text-align: left; width: 100%; background: var(--bg); }
  .lesson-btn .lt { display: grid; gap: 0; }
  .lesson-btn .lt small { color: var(--muted); font-weight: 500; }
  .tag { font: 700 .72rem var(--body); letter-spacing: .06em; text-transform: uppercase; padding: 3px 8px; border-radius: 999px; background: var(--chip); color: var(--muted); white-space: nowrap; }
  .tag.done { background: var(--ok-bg); color: var(--ok-ink); }
  .tag.part { background: var(--say-bg); color: var(--say-ink); }

  /* Lesson */
  .progress { height: 8px; background: var(--chip); border-radius: 999px; overflow: hidden; }
  .progress > div { height: 100%; background: var(--accent); width: 0; }
  @media (prefers-reduced-motion: no-preference) { .progress > div { transition: width .25s; } }
  .steps-nav { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; }
  .steps-nav button { min-height: 36px; min-width: 36px; padding: 4px 10px; font-size: .9rem; flex: 0 0 auto; }
  .steps-nav button[aria-current="step"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .steps-nav button.done:not([aria-current="step"]) { background: var(--ok-bg); color: var(--ok-ink); }
  .block { border-radius: 10px; padding: 12px 14px; display: grid; gap: 6px; }
  .block .lbl { font: 700 .78rem var(--body); letter-spacing: .08em; text-transform: uppercase; }
  .say { background: var(--say-bg); color: var(--say-ink); }
  .say q { font-size: 1.15rem; font-weight: 600; quotes: "“" "”"; }
  .watch { background: var(--watch-bg); color: var(--watch-ink); }
  .ifthen { background: var(--warn-bg); color: var(--warn-ink); }
  .good { background: var(--ok-bg); color: var(--ok-ink); }
  ul.clean { margin: 0; padding-left: 1.2em; display: grid; gap: 4px; }
  .checks { display: grid; gap: 6px; }
  .checks label { display: flex; gap: 10px; align-items: flex-start; padding: 6px 0; cursor: pointer; }
  .checks input { width: 22px; height: 22px; flex: 0 0 auto; margin-top: 2px; accent-color: var(--accent); }
  .showbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .emoji-strip { font-size: 2rem; letter-spacing: 4px; }
  .cue-chip { display: inline-flex; gap: 6px; align-items: center; border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; font-size: .92rem; background: var(--bg); }
  .cue-chip b { font-family: var(--display); }
  .stepfoot { display: grid; grid-template-columns: auto 1fr; gap: 8px; }
  .stepfoot .primary { min-height: 56px; font-size: 1.1rem; }
  .gate { display: grid; gap: 8px; }
  .gate-out { border-radius: 10px; padding: 12px 14px; font-weight: 600; }

  /* Child view */
  #kid { position: fixed; inset: 0; z-index: 50; background: var(--surface); display: grid; place-items: center; text-align: center;
    padding: max(24px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(24px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
  #kid[hidden] { display: none; }
  #kid .big { font-size: min(28vw, 9rem); line-height: 1.1; }
  #kid .phrase { font: 700 clamp(1.6rem, 7vw, 3rem)/1.15 var(--display); text-transform: uppercase; max-width: 16ch; margin: 16px auto 0; text-wrap: balance; }
  #kid .hint { margin-top: 12px; color: var(--muted); }
  #kid .faces { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; font-size: min(16vw, 4.5rem); }
  #kid .faces span { cursor: default; }
  #kid button { margin-top: 24px; }
  @media (max-width: 520px) { h1 { font-size: 1.9rem; } body { font-size: 16px; } }
</style>

<main id="app"></main>
<div id="kid" hidden role="dialog" aria-modal="true" aria-label="Show your child"></div>

<script>
(function () {
  "use strict";

  /* ---------- Reference data (from the program files) ---------- */
  var CUES = {
    B1: ["🧽", "Squeeze the brake like a sponge.", "Squeeze a fist slowly"],
    B2: ["🗿", "Stop at the cone, like a statue.", "Flat palm: stop"],
    B3: ["🚂↪️", "Brake first, then turn.", "Palm down, then a curving hand"],
    B4: ["🧽", "Let the sponge go slowly.", "Open your fist slowly"],
    T1: ["🪥", "Squeeze the go-pedal like toothpaste.", "Thumb pressing slowly"],
    T2: ["🦶⬇️", "Foot to the floor until the cone.", "Gentle stamp, then point at the cone"],
    T3: ["⬆️👍", "Wheel straight? Then go!", "Hands level, then thumbs up"],
    T4: ["👣", "Feet take turns.", "One hand up, the other down"],
    T5: ["🤫", "Quiet foot in the pits.", "Finger to lips"],
    W1: ["🐦", "Hold the wheel like a baby bird.", "Cupped hands"],
    W2: ["🕘🕒", "Hands on the clock: 9 and 3.", "Point at both sides"],
    W3: ["🌈", "Paint a smooth rainbow.", "One smooth arc of your hand"],
    W4: ["⏳🔶", "Wait for the turn cone.", "One finger up, then point"],
    W5: ["⚽➡️", "Let it roll to the edge.", "Hand rolling outward"],
    V1: ["🏴‍☠️🔭", "Pirate telescope: look far!", "Hands like a telescope"],
    V2: ["👀➡️", "Middle of the corner, then the exit kerb.", "Point to the middle, then the exit"],
    V3: ["👀🙌🏎️", "Hands follow eyes, kart follows hands.", "Point: eyes, hands, forward"],
    V4: ["🕳️", "Look at the gap, not the wall.", "Point at an open space"],
    V5: ["🔭➡️", "At the turn, look at the exit.", "Point one corner ahead"],
    R1: ["⬆️", "Your lap is in front of you.", "Point forward"],
    R2: ["🟩🟨🟥🏁", "Green go · yellow slow snail · red statue · chequered party.", "Hold up each flag card"],
    R3: ["🚂", "Be a train on its track.", "Flat hand sliding straight"],
    R4: ["✋", "Hand up, slowing down.", "Hand up"],
    R5: ["✋🧍", "Stopped? Hand up, stay put, wait for help.", "Hand up, freeze"]
  };

  var DRILLS = {
    D01: { name: "Paddock Pedal Game", setup: "Kart on a stand or chocked, ENGINE OFF, kill switch off. Child in the seat. You stand in front with picture cards 🧽 (brake) and 🪥 (go).", how: "Show a card; they squeeze that pedal slowly, hold, let go slowly. 10–20 calls, about 2 minutes.", fix: [["They press both pedals together", "Slow your calls right down. Praise “feet took turns!”"], ["They stamp", "Say the cue again, slower: “squeeze… hold… let go slowly.”"]] },
    D02: { name: "Stop Box", setup: "Four soft cones at the edge of a straight (or the pit lane, if allowed) making a box about 3 kart lengths long. Only with the track's permission and no other karts moving.", how: "Drive in slowly and stop with the kart's nose inside the box.", fix: [["They stamp and slide", "Go back to B1: “squeeze like a sponge.”"], ["They stop early", "That's fine. Praise it."], ["They overshoot", "Slower approach next lap. Make the box bigger."]] },
    D03: { name: "Follow the Leader", setup: "An adult, coach or experienced older driver leads at a gentle steady pace — ONLY in a session the track approves. No lead kart? Do it on foot: walk the racing line with your child behind you holding a paper-plate wheel.", how: "Child follows the leader's line. Leader keeps several kart lengths of gap and never brakes suddenly. No overtaking.", fix: [["They look back for the leader after getting dropped", "R1: “Your lap is in front of you.”"], ["They get too close", "Leader slows gently; tell your child “stay one big gap behind.”"]] },
    D04: { name: "Flag Game", setup: "Flag cards or real flags: 🟩 🟨 🟥 🏁.", how: "Paddock first: show a flag, they do the action — green drive fast, yellow slow snail, red freeze like a statue, chequered cheer. On track only where a marshal or allowed helper can show flags from a safe spot.", fix: [["They stop dead for yellow", "Yellow means SLOW, not stop. Act out a snail."]] },
    D05: { name: "Pirate Telescope", setup: "A helper in the spectator area at the end of the main straight holds up a bright towel or big picture card. Never on the track side of the barrier.", how: "Change the colour each lap. After the run ask: “What did the pirate see?”", fix: [["They didn't see anything", "Bigger, brighter target. Make it a game, not a test."], ["They drift toward the target", "Move the target to the exit side, so looking at it means looking down the track."]] },
    D06: { name: "Flat Out Until the Cone", setup: "One soft cone at the track edge, well before a corner. Day 1: put it where your child already lifts off easily.", how: "“Foot to the floor until the cone, then your normal corner.” After 2 good runs, move the cone about one kart length closer — only if your child says yes.", fix: [["They brake hard and late after the cone", "Move the cone BACK one step. Fear is information, not failure."], ["They lift before the cone", "Leave it where it is. Praise any lap they held it."]] },
    D07: { name: "Brake at the Cone", setup: "One soft cone at the track edge where braking (or lifting) should START. Ask your club which corners need braking in a Kid Kart.", how: "“Squeeze the brake at the cone, finish, then turn.”", fix: [["They stamp", "B1: “squeeze like a sponge.”"], ["They brake while turning", "B3 again, and move the cone a little earlier."]] },
    D08: { name: "Wait for the Turn Cone", setup: "One soft cone on the OUTSIDE edge where the kart should start turning.", how: "“Keep it straight… wait… turn at the cone.”", fix: [["They turn before the cone", "Totally normal — it's the most common beginner mistake. Repeat W4, praise any lap they waited."], ["They wait, then turn sharply", "W3: “paint a smooth rainbow.”"]] },
    D09: { name: "Roll to the Edge", setup: "One cone outside the exit kerb, or a helper behind the barrier holding a picture.", how: "“Look at the exit cone, let the kart roll out to it. Wheel straight, then go.”", fix: [["They steer toward the edge (wiggle)", "“Let it roll — don't steer it.”"], ["They stay tight on the inside", "Point at the exit target before the run."]] },
    D10: { name: "Cones on Holiday", setup: "Remove the cones. On a walk, your child picks a real “treasure” (post, kerb end, crack, sign) for each cone's job and you photograph it.", how: "“Today the cones are on holiday. Use the yellow post instead.”", fix: [["The skill drops a little", "Normal at first. Only bring cones back if it drops for a whole day."]] },
    D11: { name: "Same Lap Again (Grapes)", setup: "Lap timing: transponder, lap timer or phone stopwatch. A notebook. Grape stickers 🍇.", how: "“Make every lap the same, like stickers in a row.” Write lap times. Spread = slowest minus fastest. Tell your child “close together!” — not the numbers.", fix: [["They chase one fast lap", "Praise the bunch of grapes, never the fastest lap."]] },
    D12: { name: "Line Explorer", setup: "Pick one corner on the track walk. Name three lines: wide whale 🐋, middle fish 🐟, tight crab 🦀.", how: "One lap of each, in order. Then your child picks their favourite for the rest of the run.", fix: [["The crab line hits the kerb hard", "Tight means close, not on top."]] },
    D13: { name: "Traffic Buddy", setup: "ONLY in a track-approved session with other karts. Agree it with the other driver's parent or coach first.", how: "“If someone comes past, be a train on its track.”", fix: [["They swerve or stop", "R3 again before the next run. Shorter session."], ["They keep looking behind", "R1: “Your lap is in front of you.”"]] },
    D14: { name: "Video Detective", setup: "Camera securely mounted on the kart (many series ban helmet cameras) or a phone filming from a spectator spot.", how: "Show ONE clip under 2 minutes. Ask “What do you see?” then “Find one place you were smooth.”", fix: [["You start explaining the whole clip", "Stop. Let your child talk first."]] },
    D15: { name: "Calm Hands", setup: "Stickers on the gloves at 9 and 3 (if allowed). Phone for a short video.", how: "One run of “baby bird hands”. Watch: quiet on the straights? One smooth arc in corners?", fix: [["“Calm” becomes floppy", "The bird mustn't fly away — firm, not tight."], ["Big sim-style steering", "W3: one smooth rainbow per corner."]] },
    D16: { name: "Track Walk Treasure Hunt", setup: "Walk the track ONLY when it is closed and the track allows it. Hold hands near the edge.", how: "Give each corner a fun name (“Dinosaur Corner”). Find treasures: kerb colours, signs, posts. Photograph each corner — that's your picture map for between-run chats.", fix: [] },
    D17: { name: "10-Lap Grapes (sim)", setup: "Short kart track, easy kart. Pen and paper.", how: "10 laps in a row, NO restarts. Write lap times; mark laps with an off-track as “oops”. Spread = slowest − fastest.", fix: [["They want to restart after a mistake", "“Real karts don't restart — keep going!”"]] },
    D18: { name: "Sim Stop Box", setup: "Pick 3 features in the sim: a sign, a kerb end, a tyre wall.", how: "You point at the one to stop next to. One lap, then stop. Repeat with a different feature.", fix: [] },
    D19: { name: "Gold Laps (no touching)", setup: "Phase track, rental kart.", how: "A lap with no wall, grass or barrier touch = ⭐ gold lap. How many before the timer ends?", fix: [["They go very slowly to avoid touches", "That's fine at first. Smooth beats fast."]] }
  };

  var GAMES = {
    G01: "Red Light, Green Light: call 🟩 green (run or “drive”), 🟥 red (freeze), 🟨 yellow (slow motion).",
    G02: "Flag Statues: your child “drives” with a paper-plate wheel; you show a flag — 🟩 fast, 🟨 slow snail, 🟥 statue, 🏁 finish-party dance.",
    G03: "Partner Toss: gentle underarm beanbag toss, 2–3 big steps apart. Count catches in a row.",
    G04: "Ball Drop Catch: hold a tennis ball at shoulder height, drop it without warning, they catch after one bounce.",
    G07: "Look-Far Game: from across the paddock, hold up coloured cards or fingers; they call them out.",
    G08: "Scooter or Balance-Bike Slalom (helmet on): 4–6 cones in a wavy line. “Look at the NEXT cone, not this one.”",
    G09: "Shadow Tag: your child walks a set path; you run past on either side; they stay on their path like a train on its track.",
    G10: "Sponge Squeeze: wet sponge over a cup. “Make it rain slowly… now a storm… now slowly again.”",
    G11: "Mirror Me: face each other, move your hands slowly like steering; your child copies like a mirror.",
    G12: "Paper-Plate Driver: your child holds a paper plate as a wheel and follows you along the line, hands at 9 and 3."
  };

  var CHOICE = "Show the four choice pictures and let your child point: 🐢 snail lap waving at you, then normal driving · 🎯 pirate target (you hold up a colour) · 🔁 repeat today's favourite drill · 🆓 free run (no cue, no questions after).";

  /* ---------- Track cards ---------- */
  var TR = {
    "TR-00": { title: "Fun Only Day", focus: "Enjoy driving. No cues. Really, none.", strip: "🎉🏎️🐢🆓🍦", cues: [], kit: ["A non-karting treat for afterwards"], warm: "Any game your child chooses.",
      runs: [
        { label: "Runs 1–3 · Free runs", drill: null, cue: null, before: "Nothing to set up.", watch: "Smiling at the pit gate.", ask: "Did you have fun?" },
        { label: "Run 4 · Snail & wave", drill: null, cue: null, before: "Tell them: one slow lap waving at you.", watch: "A wave.", ask: "What shall we have for lunch?" }
      ],
      twist: "No afternoon plan. Your child picks a choice run, or stops. Max 6 runs in total — stopping after 2 is fine.", score: [], next: "Repeat the last card your child enjoyed." },
    "TR-01": { title: "Hello Kart", focus: "Feel at home in the kart again, and copy a smooth line.", strip: "👋🏎️ 🗺️ 🚶➡️🏎️ 👀⬆️", cues: ["R1", "V1", "T5"], kit: ["Phone for corner photos", "Paper plate (steering wheel)"], warm: "D16 track walk (name corners, photograph them), then G12 — your child walks the line behind you holding the paper plate.", warmDrill: "D16",
      runs: [
        { label: "Run 1 · Free, gentle pace", drill: null, cue: "T5", before: "No drill. YOU just watch — this is the baseline. Note: pedals smooth? Hands calm? Eyes up? Looks behind?", watch: "Leaves the pits calmly.", ask: "Point to your favourite corner on the photos." },
        { label: "Run 2 · Follow the Leader", drill: "D03", cue: "R1", watch: "Stays behind the leader for most of a lap.", ask: "Was it easy or tricky to follow? Thumb up, sideways or down?" },
        { label: "Run 3 · Follow a quicker leader", drill: "D03", cue: "R1", before: "Leader goes slightly quicker — still steady.", watch: "Eyes forward, not checking behind.", ask: "What colour was the kerb at Dinosaur Corner?" },
        { label: "Run 4 · Show me Dinosaur Corner", drill: null, cue: "V1", before: "Free run: “Show me your favourite corner!”", watch: "Smiles, smooth.", ask: "Tell me about that run!" }
      ],
      twist: "Runs 6–9: the leader drives a slightly different line for 2 laps and your child copies it, then free running. Run 10 = your child's choice.", score: ["A01–A13 baseline (watch only)", "D03 follow score 1–3"] },
    "TR-02": { title: "Sponge & Toothpaste", focus: "Smooth pedals: squeeze on, squeeze off, one at a time.", strip: "🧽 🪥 👣", cues: ["T1", "B1", "T4"], kit: ["A real sponge and a cup of water", "Picture cards 🧽 and 🪥"], warm: "G10 Sponge Squeeze, then D01 Paddock Pedal Game in the kart with the engine OFF.", warmDrill: "D01",
      runs: [
        { label: "Run 1 · Yesterday's cue", drill: null, cue: "R1", before: "Sunday warm-up run: repeat yesterday's main cue only.", watch: "Eyes forward.", ask: "Tell me about that run!" },
        { label: "Run 2 · Toothpaste out of the corners", drill: null, cue: "T1", before: "Before the run, squeeze an imaginary toothpaste tube together.", watch: "The engine note rises smoothly out of each corner — no stab-stab.", ask: "Was your toothpaste slow or fast?" },
        { label: "Run 3 · Sponge before the corners", drill: null, cue: "B1", watch: "Gentle slowing, no skids, the kart doesn't lurch.", ask: "Show me with your hand how you pressed the sponge." },
        { label: "Run 4 · Feet take turns", drill: null, cue: "T4", watch: "Never both pedals at once (the kart doesn't pitch or bog in corners).", ask: "Which corner had the smoothest toothpaste? Point on the photos." }

      twist: "Do D01 again in the paddock with EYES CLOSED (you call “sponge!” / “toothpaste!”). Then runs 6–9 repeat runs 2–4 in any order your child picks. Run 10 = choice.", score: ["A02 smooth throttle", "A03 feet take turns", "A04 smooth brake"] },

      runs: [

    "TR-04": { title: "Pirate Telescope", focus: "Eyes up and far.", strip: "🏴‍☠️🔭 🎨 ⬆️", cues: ["V1", "R1"], kit: ["3 coloured towels or big picture cards", "A helper in the spectator area"], warm: "G07 Look-Far Game across the paddock.",

  var BY_ID = {}; LESSONS.forEach(function (l, i) { l.index = i; BY_ID[l.id] = l; });

  function drillCard(code) {

  function renderHome() {
    var resume = state.last && BY_ID[state.last.id];
    var top = h("header", { class: "card" }, [
      h("p", { class: "eyebrow", text: "Age 5 · Kid Kart · Comer C52 · weekends" }),
      h("h1", null, ["Kid Kart ", h("span", { text: "Coaching Course" })]),
      p("Twelve weekends, step by step. Each lesson tells you what to set up, what to say, what to show your child, what to watch for, and what to do if it goes wrong.", "muted"),
      h("div", { class: "row" }, [
        resume ? h("a", { class: "btn primary", href: "#" + resume.id, style: "background:var(--accent);color:var(--accent-ink);border-color:var(--accent)", text: "Resume: " + resume.code + " " + resume.title }) :
          h("a", { class: "btn", href: "#w1-sat", style: "background:var(--accent);color:var(--accent-ink);border-color:var(--accent)", text: "Start Week 1" }),
        h("a", { class: "btn", href: "#fun-only", text: "🎉 Fun Only Day" })
      ])
    ]);
    var rules = h("section", { class: "card" }, [
      h("h2", { text: "Six rules for every session" }),
      h("ol", { class: "clean" }, ["One focus, max 3 cues. Same words every time.", "Your child talks first after every run.", "Nothing new on the grid: “Have fun, I'm watching you!”", "A child's choice in every session.", "Fun drops two sessions in a row → next session is a Fun Only Day.", "Move on when the skill shows up, not when the calendar says."].map(function (t) { return h("li", { text: t }); }))
    ]);
    var map = PHASES.map(function (ph) {
      return h("section", { class: "phase" }, [
        h("div", { class: "phase-head" }, [h("p", { class: "eyebrow", text: "Phase " + ph.n }), h("h2", { text: ph.name }), p(ph.line, "muted")]),
        h("div", { class: "phase" }, ph.weeks.map(function (wk) {
          var ls = LESSONS.filter(function (l) { return l.week === wk.w; });
          return h("div", { class: "week" }, [
            h("div", { class: "week-title", text: "Weekend " + wk.w + (wk.light ? " · lighter" : "") }),
            h("div", { class: "lessons" }, ls.map(function (l) {
              var st = lessonStatus(l);
              return h("a", { class: "btn lesson-btn", href: "#" + l.id }, [
                h("span", { class: "lt" }, [h("span", { text: (l.kind === "sim" ? "🖥️ " : "🏎️ ") + l.title }), h("small", { text: l.day + " · " + l.code })]),
                h("span", { class: "tag " + st[1], text: st[0] })
              ]);
            }))
          ]);
        }))
      ]);
    });
    var reset = h("button", { type: "button", class: "link", text: "Reset all progress on this device" });
    reset.addEventListener("click", function () {
      if (reset.getAttribute("data-armed")) { state = { done: {}, last: null, funs: [] }; persist(); render(); return; }
      reset.setAttribute("data-armed", "1"); reset.textContent = "Tap again to reset everything";
    });
    app.textContent = "";
    [top, rules].concat(map).concat([h("p", { class: "muted small" }, ["Progress is saved in this browser only. Full program, drills and sources are in the repo's /program folder. ", reset])]).forEach(function (n) { app.appendChild(n); });
  }

  function renderLesson(l) {
    var si = Math.min(state.last && state.last.id === l.id ? state.last.step : firstUndone(l), l.steps.length - 1);
    state.last = { id: l.id, step: si }; persist();
    var step = l.steps[si], ds = doneSet(l.id);
    var pct = Math.round(ds.length / l.steps.length * 100);
    var nav = h("nav", { class: "steps-nav", "aria-label": "Steps" }, l.steps.map(function (s, i) {
      return h("button", { type: "button", class: ds.indexOf(i) >= 0 ? "done" : null, "aria-current": i === si ? "step" : null, title: s.title, text: String(i + 1),
        onclick: function () { state.last = { id: l.id, step: i }; persist(); render(); } });
    }));
    var head = h("header", { class: "card" }, [
      h("div", { class: "row" }, [h("a", { href: "#home", class: "btn", text: "← Course" }), h("span", { class: "grow" }), h("span", { class: "tag", text: l.day })]),
      h("p", { class: "eyebrow", text: (l.week ? "Weekend " + l.week + " · " : "") + l.code }),
      h("h1", { text: l.title, style: "font-size:2rem" }),
      h("div", { class: "progress", role: "progressbar", "aria-valuenow": pct, "aria-valuemin": 0, "aria-valuemax": 100, "aria-label": "Lesson progress" }, [h("div", { style: "width:" + pct + "%" })]),
      nav
    ]);
    var isLast = si === l.steps.length - 1;
    var back = h("button", { type: "button", text: "Back", disabled: si === 0 ? "disabled" : null, onclick: function () { state.last.step = si - 1; persist(); render(); window.scrollTo(0, 0); } });
    var next = h("button", { type: "button", class: "primary", text: isLast ? (ds.indexOf(si) >= 0 ? "Lesson done ✓" : "Finish lesson") : "Done · next step →",
      onclick: function () {
        if (ds.indexOf(si) < 0) ds.push(si);
        if (isLast) { persist(); location.hash = "#home"; render(); return; }
        state.last.step = si + 1; persist(); render(); window.scrollTo(0, 0);
      } });
    var body = h("section", { class: "card", "aria-labelledby": "stepTitle" }, [
      h("p", { class: "eyebrow", text: "Step " + (si + 1) + " of " + l.steps.length }),
      h("h2", { id: "stepTitle", text: step.title })
    ].concat(stepBody(step, l)).concat([h("div", { class: "stepfoot" }, [back, next])]));
    app.textContent = "";
    app.appendChild(head); app.appendChild(body);
  }
  function firstUndone(l) { var d = doneSet(l.id); for (var i = 0; i < l.steps.length; i++) if (d.indexOf(i) < 0) return i; return 0; }

  function render() {
    var id = (location.hash || "").slice(1);
    var l = BY_ID[id];
    if (l) renderLesson(l); else renderHome();
  }
  window.addEventListener("hashchange", function () {
    var l = BY_ID[(location.hash || "").slice(1)];
    if (l && (!state.last || state.last.id !== l.id)) state.last = { id: l.id, step: firstUndone(l) };
    render(); window.scrollTo(0, 0);
  });
  render();
})();
</script>
